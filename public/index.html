    function stripMd(s) {
      return s.replace(/\*\*/g, '').replace(/~~/g, '').trim();
    }

    function parseMarkdown(md) {
      let name = null;
      const categories = [];
      const byKey = new Map(); // duplicate category names (active vs done block) merge
      let cur = null;
      for (const raw of md.split(/\r?\n/)) {
        const line = raw.replace(/\s+$/, '');
        if (!line.trim() || /^-{3,}$/.test(line.trim())) continue;
        const h = line.match(/^#+\s+(.*)$/);
        if (h) { if (!name) name = stripMd(h[1]); continue; }
        const m = line.match(/^(\s*)[*+-]\s+(.*)$/);
        if (!m) continue;
        const indent = m[1].replace(/\t/g, '  ').length;
        let text = m[2].trim();
        let checked = false;
        const struck = text.match(/^~~(.*)~~$/s);
        if (struck) { checked = true; text = struck[1].trim(); }
        text = text.replace(/\*\*/g, '').trim();
        if (!text) continue;
        if (indent === 0) {
          const key = text.toLowerCase();
          cur = byKey.get(key);
          if (!cur) {
            cur = { name: text, items: [] };
            byKey.set(key, cur);
            categories.push(cur);
          }
        } else {
          if (!cur) {
            cur = { name: 'General', items: [] };
            byKey.set('general', cur);
            categories.push(cur);
          }
          cur.items.push({ text, checked });
        }
      }
      return { name, categories };
    }

    // --- modal plumbing ---------------------------------------------------------
    // Every app modal goes through here so the mobile rules hold in one place:
    // the card is capped to the viewport (never wider than the screen, never
    // taller than the safe area), the body inside it wraps rather than pushing
    // the card sideways, and the page behind stops scrolling. The scroll lock
    // also detaches the kit's window pull-to-refresh: it listens on `window`
    // and only stands down when the page is scrolled, so with a modal open at
    // the top of the page a downward drag on the backdrop — or inside the card —
    // rubber-banded the list behind instead of scrolling the modal.
    let ptrHandle = null;
    let scrollLocks = 0, lockedScrollY = 0;

    function lockPage() {
      if (scrollLocks++) return;
      lockedScrollY = window.scrollY || window.pageYOffset || 0;
      if (ptrHandle) { ptrHandle.detach(); ptrHandle = null; }
      document.body.style.top = -lockedScrollY + 'px';
      document.documentElement.classList.add('modal-open');
    }

    function unlockPage() {
      if (!scrollLocks || --scrollLocks) return;
      document.documentElement.classList.remove('modal-open');
      document.body.style.top = '';
      window.scrollTo(0, lockedScrollY);
      attachPtr();
    }

    function presentAppModal(el, { wide, onDismiss } = {}) {
      el.classList.add('modal-card');
      lockPage();
      const m = unNative.presentModal({
        contentEl: el,
        onDismiss: () => { unlockPage(); if (onDismiss) onDismiss(); },
      });
      // Set on the card itself so the width cap survives the kit's own rule.
      if (m.el) m.el.classList.add(wide ? 'modal-wide' : 'modal-narrow');
      return m;
    }

    // --- Offline & storage read-out (issue #47) ---------------------------------
    // "Is offline actually working, especially in the app?" was the literal
    // question the issue asked, and until now nothing could answer it: both
    // failure modes (a service worker the WebView refuses to register, storage
    // it refuses to grant) are silent. This is the answer — read-only, works
    // offline, no writes, and screenshot-able from inside the native app.
    let diagModal = null;

    async function shellCacheState() {
      if (!('caches' in window)) return 'not supported on this device';
      try {
        // Found by suffix rather than a hardcoded version string, so a
        // CACHE_VERSION bump in sw.js can never make this lie.
        const names = await caches.keys();
        const shell = names.find(n => /-shell$/.test(n));
        if (!shell) return 'not saved yet';
        const hit = await caches.match('/index.html', { cacheName: shell });
        return hit ? 'saved' : 'not saved yet';
      } catch (_) { return 'unavailable'; }
    }

    async function swState() {
      if (!('serviceWorker' in navigator)) return 'not supported on this device';
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (!reg) return 'not registered';
        if (reg.active) return 'active';
        if (reg.waiting) return 'registered (waiting)';
        if (reg.installing) return 'installing';
        return 'registered';
      } catch (_) { return 'blocked by this browser'; }
    }

    function agoLabel(ts) {
      if (!ts) return 'not yet this session';
      const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
      if (s < 10) return 'just now';
      if (s < 60) return s + ' seconds ago';
      const m = Math.round(s / 60);
      if (m < 60) return m + ' minute' + (m === 1 ? '' : 's') + ' ago';
      const h = Math.round(m / 60);
      return h + ' hour' + (h === 1 ? '' : 's') + ' ago';
    }

    function diagRow(label, value) {
      return `<div class="flex items-start justify-between gap-3 py-1.5">
                <span class="text-[13px] shrink-0" style="color: var(--label2)">${esc(label)}</span>
                <span class="text-[13px] text-right" style="color: var(--label)">${esc(value)}</span>
              </div>`;
    }

    // The rows that answer "why is there no saved copy?" — see BOOT_STORAGE.
    // Deliberately concrete: a yes/no plus the namespace, because "storage is
    // available" was already on this card and was true in the one case that
    // mattered while nothing had actually persisted.
    function diagStorageRows() {
      const home = cacheGet(HOME_KEY);
      const homeLabel = homeSaveFailed ? "couldn't save — storage refused it"
        : Array.isArray(home) ? home.length + (home.length === 1 ? ' list' : ' lists')
        : 'not saved yet';
      const who = HAVE_TOKEN_IDENTITY ? "this session's sign-in"
        : identity ? 'remembered from a previous visit'
        : 'unknown — nothing remembered';
      return [
        diagRow('Home copy saved', homeLabel),
        diagRow('Saved under', (identity && identity.id != null ? 'user ' + identity.id : 'no account') ),
        diagRow('Identity from', who),
        diagRow('App data found at start', BOOT_STORAGE.ours
          ? BOOT_STORAGE.ours + ' item' + (BOOT_STORAGE.ours === 1 ? '' : 's')
            + ' (' + BOOT_STORAGE.mine + ' for this account)'
          : 'none — nothing survived from last time'),
      ].join('');
    }

    async function openDiagnostics() {
      if (!window.unNative) { toast('This needs the UI kit, which failed to load'); return; }
      if (diagModal) diagModal.dismiss();
      const el = document.createElement('div');
      el.className = 'flex flex-col gap-2';
      const savedLists = (cacheGet(LRU_KEY) || []).length;
      const queued = queueLength();
      el.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <h2 class="font-semibold text-lg">Offline &amp; storage</h2>
          <button onclick="closeDiagnostics()" class="x-close text-xl leading-none px-1 shrink-0">&times;</button>
        </div>
        <div id="diag-body" class="divide-y" style="border-color: var(--separator)">
          ${diagRow('Saved for offline', 'checking…')}
          ${diagRow('Background updater', 'checking…')}
          ${diagRow('Storage on this device', DURABLE ? 'available' : 'not allowed — this session only')}
          ${diagStorageRows()}
          ${diagRow('Lists saved offline', String(savedLists))}
          ${diagRow('Changes waiting to sync', String(queued))}
          ${diagRow('Last successful sync', agoLabel(lastSyncAt))}
        </div>
        <p class="text-xs mt-1" style="color: var(--label3)">
          Nothing here is sent anywhere — it describes what this device has saved.
        </p>`;
      const handle = presentAppModal(el, {
        onDismiss: () => { if (diagModal === handle) diagModal = null; },
      });
      diagModal = handle;
      // The two async probes fill in after the card is up, so opening it is
      // never gated on a cache lookup.
      const body = el.querySelector('#diag-body');
      const [shell, sw] = await Promise.all([shellCacheState(), swState()]);
      if (!body.isConnected) return; // dismissed while we were probing
      body.innerHTML = [
        diagRow('Saved for offline', shell),
        diagRow('Background updater', sw),
        diagRow('Storage on this device', DURABLE ? 'available' : 'not allowed — this session only'),
        diagStorageRows(),
        diagRow('Lists saved offline', String(savedLists)),
        diagRow('Changes waiting to sync', String(queued)),
        diagRow('Last successful sync', agoLabel(lastSyncAt)),
      ].join('');
    }
    function closeDiagnostics() {
      if (diagModal) diagModal.dismiss();
    }

    // Markdown import/export presents in the kit's centered modal (backdrop
    // tap and Escape dismiss). The card's height is budgeted so the textarea is
    // the only thing that scrolls — no second scrollbar on the card, and no
    // page scroll behind it.
    let mdModal = null;
    function openMd({ title, hint, text, readonly, actionsHtml }) {
      if (!window.unNative) { toast('Import/export needs the UI kit, which failed to load'); return; }
      if (mdModal) mdModal.dismiss();
      const el = document.createElement('div');
      el.className = 'md-body flex flex-col gap-3';
      el.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <h2 class="font-semibold text-lg">${esc(title)}</h2>
          <button onclick="closeMd()" class="x-close text-xl leading-none px-1 shrink-0">&times;</button>
        </div>
        <p class="text-xs" style="color: var(--label2)">${esc(hint)}</p>
        <textarea id="md-text" rows="12" spellcheck="false" wrap="soft"
                  class="w-full rounded-lg p-3 text-xs font-mono focus:outline-none resize-none"
                  style="background: var(--fill); color: var(--label); border: 1px solid var(--separator)"></textarea>
        <div class="flex flex-wrap justify-end gap-2">${actionsHtml}</div>
      `;
      const ta = el.querySelector('#md-text');
      ta.value = text;
      ta.readOnly = !!readonly;
      ta.placeholder = readonly ? '' : '# **My List**\n\n* Category\n  * item\n  * ~~done item~~';
      // Identity-checked so the outgoing modal's late onDismiss (it fires after
      // the fade) can't null out the handle of the one that replaced it.
      const handle = presentAppModal(el, {
        wide: true,
        onDismiss: () => { if (mdModal === handle) mdModal = null; },
      });
      mdModal = handle;
      if (!readonly) setTimeout(() => ta.focus(), 0);
    }
    function closeMd() {
      if (mdModal) mdModal.dismiss();
    }

    function openExport() {
      openMd({
        title: 'Export markdown',
        hint: 'Copy this markdown or download it as a file.',
        text: buildMarkdown(),
        readonly: true,
        actionsHtml: `
          <button onclick="copyMd()" class="text-sm px-3 py-1.5 rounded-lg ${BTN_SOFT}">Copy</button>
          <button onclick="downloadMd()" class="text-sm px-3 py-1.5 rounded-lg btn-primary">Download .md</button>`,
      });
    }

    async function copyMd() {
      const ta = document.getElementById('md-text');
      try {
        await navigator.clipboard.writeText(ta.value);
        toast('Copied to clipboard');
      } catch (_) {
        ta.select();
        document.execCommand('copy');
        toast('Copied to clipboard');
      }
    }

    function downloadMd() {
      const blob = new Blob([document.getElementById('md-text').value], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (current ? current.list.name.replace(/[^\w\d-]+/g, '-').replace(/^-+|-+$/g, '') || 'list' : 'list') + '.md';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    // mode 'new' (from Home: create a list) or 'merge' (into the current list,
    // which offers both add and replace).
    function openImport(mode, text) {
      openMd({
        title: 'Import markdown',
        hint: mode === 'new'
          ? 'Paste markdown to create a new list. ~~Strikethrough~~ items import as completed.'
          : 'Paste markdown to import into this list. Add merges into matching categories; Replace clears the list first. ~~Strikethrough~~ items import as completed.',
        text: text || '',
        readonly: false,
        actionsHtml: mode === 'new' ? `
          <button onclick="closeMd()" class="text-sm px-3 py-1.5 rounded-lg ${BTN_SOFT}">Cancel</button>
          <button onclick="runImport('new', this)" class="text-sm px-3 py-1.5 rounded-lg btn-primary">Import</button>` : `
          <button onclick="closeMd()" class="text-sm px-3 py-1.5 rounded-lg ${BTN_SOFT}">Cancel</button>
          <button onclick="runImport('replace', this)" class="text-sm px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white">Import (replace)</button>
          <button onclick="runImport('add', this)" class="text-sm px-3 py-1.5 rounded-lg btn-primary">Import (add)</button>`,
      });
    }

    // A whole-list write, so it gets the longest deadline — and a guard, because
    // a double-tapped import is a duplicated list.
    let importing = false;
    async function runImport(mode, btn) {
      if (!requireOnline()) return;
      if (importing) return;
      const md = document.getElementById('md-text').value;
      const { name, categories } = parseMarkdown(md);
      if (!categories.length || !categories.some(c => c.items.length)) {
        return toast('Nothing to import — expected bullets like "* Category" with "  * item" beneath');
      }
      if (mode === 'replace' &&
          !await askConfirm('Replace everything in "' + current.list.name + '" with the imported content?', 'Replace')) {
        return;
      }
      importing = true;
      try {
      await withBusy(btn, async () => {
        try {
          if (mode === 'new') {
            const { list } = await api('/api/lists/import', {
              method: 'POST',
              body: JSON.stringify({ name: name || 'Imported list', categories }),
              timeoutMs: IMPORT_TIMEOUT_MS,
            });
            closeMd();
            if (location.hash === '#/list/' + list.id) loadList(list.id);
            else location.hash = '#/list/' + list.id;
          } else {
            await api('/api/lists/' + current.list.id + '/import', {
              method: 'POST',
              body: JSON.stringify({ categories, mode }),
              timeoutMs: IMPORT_TIMEOUT_MS,
            });
            closeMd();
            toast(mode === 'replace' ? 'List replaced' : 'Imported');
            refreshList();
          }
        } catch (e) {
          // A big import is exactly the request most likely to outrun its
          // deadline while still landing, so close up and go look.
          if (e.timeout) closeMd();
          reportWriteError(e);
        }
      });
      } finally { importing = false; }
    }

    // --- members modal ----------------------------------------------------------------
    // Presented in the kit's centered modal; invite/remove re-render the body
    // in place while the modal stays open.
    let membersModal = null;
    function openMembers() {
      if (!requireOnline()) return;
      if (!window.unNative) { toast('Members needs the UI kit, which failed to load'); return; }
      if (membersModal) { renderMembers(); return; }
      const el = document.createElement('div');
      el.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-4">
          <h2 class="font-semibold text-lg">Members</h2>
          <button onclick="closeMembers()" class="x-close text-xl leading-none px-1 shrink-0">&times;</button>
        </div>
        <div id="members-body"></div>
      `;
      membersModal = presentAppModal(el, { onDismiss: () => { membersModal = null; } });
      renderMembers();
    }
    function closeMembers() {
      if (membersModal) membersModal.dismiss();
    }

    function renderMembers() {
      const isOwner = current.role === 'owner';
      const body = document.getElementById('members-body');
      if (!body) return;
      // The invite box is rebuilt below, so drop any suggestions belonging to
      // the old one (and void an in-flight lookup that would repopulate them),
      // along with the note and the disabled verdict attached to the old input.
      inviteHits = []; inviteAt = -1; inviteSeq++; inviteBlocked = false;
      body.innerHTML = `
        <div class="space-y-1.5 mb-4">
          <div class="flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg" style="background: var(--fill)">
            <span class="text-sm">@${esc(current.list.owner_username)}</span>
            <span class="text-[11px] uppercase tracking-wide tinted shrink-0">Owner</span>
          </div>
          ${current.members.map(m => `
            <div class="flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg hover:bg-[var(--fill)]">
              <span class="text-sm">@${esc(m.username)}</span>
              ${isOwner && !m.shot ? `<button onclick="removeMember(${m.id}, this)" class="x-close hover:!text-red-500 text-xs shrink-0">Remove</button>` : ''}
            </div>`).join('')}
          ${!current.members.length ? '<p class="text-xs px-2 py-1 flex items-center gap-1.5" style="color: var(--label3)">' + lockSvg(11) + 'This list is private — only you can see it. Invite someone below to share it.</p>' : ''}
        </div>
        ${isOwner ? `
          <form onsubmit="return inviteMember(event)" class="flex gap-2 items-start">
            <div class="relative flex-1 min-w-0">
              <input id="invite-input" name="username" placeholder="Invite by username…" autocomplete="off" size="1"
                     role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="invite-suggest"
                     oninput="onInviteInput()" onkeydown="onInviteKey(event)"
                     class="w-full min-w-0 rounded-lg px-3 py-2 text-sm focus:outline-none"
                     style="background: var(--fill); color: var(--label); border: 1px solid var(--separator)">
              <!-- Opens upward: the invite row is the last thing in the card, so a
                   downward list would be clipped by the modal's own scroll box. -->
              <ul id="invite-suggest" role="listbox" aria-label="Matching usernames"
                  class="hidden absolute left-0 right-0 bottom-full z-20 mb-1 py-1 rounded-lg shadow-lg"
                  style="background: var(--card); border: 1px solid var(--separator); max-height: 11rem; overflow-y: auto"></ul>
            </div>
            <button id="invite-submit" class="text-sm px-3 py-2 rounded-lg btn-primary shrink-0">Invite</button>
          </form>
          <!-- The no-match / already-a-member / can't-check line. Deliberately
               OUTSIDE the listbox: a "no results" option would be arrow-selectable
               and announced as a real choice. -->
          <p id="invite-note" role="status" aria-live="polite" class="hidden text-[11px] mt-2" style="color: var(--label3)"></p>
          <p class="text-[11px] mt-2" style="color: var(--label3)">Invite anyone on Usernode by their username. Invites take effect immediately.</p>`
        : '<p class="text-xs" style="color: var(--label3)">Only the owner can manage members.</p>'}
      `;
    }

    // --- invite autocomplete ----------------------------------------------------
    // Suggestions and validation both come from the PLATFORM user directory,
    // so anyone with a Usernode account can be invited whether or not they
    // have ever opened Todo List (issue #50).
    //
    // Two tiers: the bridge (usernode.searchUsers) when the app is running
    // inside the platform shell, and this app's own server route as a fallback
    // when it isn't. Both can fail — outside the shell the bridge rejects by
    // design — and a failure NEVER blocks an invite: the box says it couldn't
    // check, the Invite button stays live, and the server has the final word.
    const INVITE_DEBOUNCE_MS = 200;
    // Below this, a prefix would be a request to enumerate the whole platform.
    const INVITE_MIN_CHARS = 2;
    // After a failed/rate-limited lookup, stop asking for a moment.
    const INVITE_BACKOFF_MS = 5000;
    const INVITE_CACHE_MAX = 50;
    // Matches the display-only fixture behind ?shot=invite — see loadShotModal.
    const SHOT_INVITE_PREFIX = 'staging-demo';
    const SHOT_INVITE_HITS = ['staging-demo-alex', 'staging-demo-sam', 'staging-demo-priya'];
    // A handle nobody owns — the refusal state behind ?shot=invitenone.
    const SHOT_INVITE_MISS = 'staging-demo-nobody';
    let inviteTimer = null, inviteSeq = 0, inviteHits = [], inviteAt = -1;
    // True only when a lookup actually answered and said this exact handle is
    // nobody. Never set from a lookup that failed to run.
    let inviteBlocked = false;
    let inviteBackoffUntil = 0;
    // q(lower) -> resolved result, for this page session only.
    const inviteCache = new Map();

    function inviteEls() {
      return {
        input: document.getElementById('invite-input'),
        box: document.getElementById('invite-suggest'),
        note: document.getElementById('invite-note'),
        submit: document.getElementById('invite-submit'),
      };
    }

    function onInviteInput() {
      const { input } = inviteEls();
      if (!input) return;
      const q = input.value.trim().replace(/^@/, '');
      // Any keystroke clears a stale verdict — the handle just changed.
      setInviteBlocked(false);
      if (inviteTimer) clearTimeout(inviteTimer);
      if (q.length < INVITE_MIN_CHARS) {
        inviteSeq++; // void anything in flight
        inviteHits = []; inviteAt = -1;
        renderInviteSuggestions();
        setInviteNote('');
        return;
      }
      inviteTimer = setTimeout(() => fetchInviteSuggestions(q), INVITE_DEBOUNCE_MS);
    }

    // Who is already spoken for on this list. Filtered client-side on the
    // bridge path, because the bridge knows nothing about this list.
    function inviteTakenHandles() {
      const taken = new Set();
      if (!current) return taken;
      if (current.list && current.list.owner_username) taken.add(current.list.owner_username.toLowerCase());
      (current.members || []).forEach(m => m && m.username && taken.add(m.username.toLowerCase()));
      return taken;
    }

    function inviteCachePut(key, value) {
      if (inviteCache.size >= INVITE_CACHE_MAX) {
        const oldest = inviteCache.keys().next().value;
        if (oldest !== undefined) inviteCache.delete(oldest);
      }
      inviteCache.set(key, value);
    }

    // Tier 1: the bridge. Rejects outside the platform shell — that's a
    // "couldn't ask", not an answer.
    async function inviteSearchViaBridge(q) {
      if (!window.usernode || typeof usernode.searchUsers !== 'function') return null;
      let out;
      try {
        out = await usernode.searchUsers(q, { limit: 10 });
      } catch (_) {
        return null;
      }
      const names = ((out && out.users) || []).map(u => u && u.username).filter(Boolean);
      const exists = names.some(n => n.toLowerCase() === q.toLowerCase());
      const taken = inviteTakenHandles();
      return {
        usernames: names.filter(n => !taken.has(n.toLowerCase())).slice(0, 8),
        exists,
        filtered: exists && taken.has(q.toLowerCase()),
        hasMore: !!(out && out.has_more),
        unavailable: false,
      };
    }

    // Tier 2: this app's server, which asks the same directory with the
    // forwarded token (and does its own owner/member filtering).
    async function inviteSearchViaServer(q) {
      if (!current || !current.list) return null;
      try {
        const r = await api('/api/lists/' + current.list.id + '/member-suggestions?q=' + encodeURIComponent(q));
        return {
          usernames: r.usernames || [],
          exists: !!r.exists,
          filtered: !!r.filtered,
          hasMore: !!r.hasMore,
          unavailable: !!r.unavailable,
        };
      } catch (_) {
        return null;
      }
    }

    const INVITE_UNAVAILABLE = { usernames: [], exists: false, filtered: false, hasMore: false, unavailable: true };

    async function fetchInviteSuggestions(q) {
      if (!current || !isOnline()) return;
      const seq = ++inviteSeq;
      const key = q.toLowerCase();
      let result = inviteCache.get(key);
      if (!result) {
        if (Date.now() < inviteBackoffUntil) return; // still backing off; keep what's on screen
        result = await inviteSearchViaBridge(q);
        if (!result) result = await inviteSearchViaServer(q);
        if (!result) result = INVITE_UNAVAILABLE;
        if (result.unavailable) inviteBackoffUntil = Date.now() + INVITE_BACKOFF_MS;
        else inviteCachePut(key, result);
      }
      if (seq !== inviteSeq) return; // a newer keystroke already won
      applyInviteResult(q, result);
    }

    function applyInviteResult(q, result) {
      inviteHits = result.usernames || [];
      inviteAt = -1;
      renderInviteSuggestions();
      if (result.unavailable) {
        setInviteNote("Can’t check usernames right now.");
        setInviteBlocked(false);
        return;
      }
      if (result.filtered) {
        setInviteNote('@' + q + ' is already on this list.');
        setInviteBlocked(false);
        return;
      }
      if (result.exists || result.hasMore) {
        // Either the typed name is on the directory, or the prefix window was
        // truncated and the exact match may simply be off the end of it —
        // ordering isn't part of the search contract, so a full page of
        // results is never proof of absence.
        setInviteNote('');
        setInviteBlocked(false);
        return;
      }
      // The directory answered and nobody by that exact name is on it. Only
      // these two paths may disable the button. Which note depends on whether
      // there is anything to pick: saying "no one matches" over a list of
      // matches reads as a dead end at the exact moment the box is being
      // helpful.
      setInviteNote(inviteHits.length
        ? 'Pick a username from the list.'
        : 'No one on Usernode matches @' + q + '.');
      setInviteBlocked(true);
    }

    function setInviteNote(msg) {
      const { note } = inviteEls();
      if (!note) return;
      note.textContent = msg || '';
      note.classList.toggle('hidden', !msg);
    }

    function setInviteBlocked(on) {
      inviteBlocked = !!on;
      const { input, submit } = inviteEls();
      if (input) {
        if (on) input.setAttribute('aria-invalid', 'true');
        else input.removeAttribute('aria-invalid');
      }
      if (submit) {
        submit.disabled = !!on;
        submit.classList.toggle('opacity-50', !!on);
      }
    }

    function renderInviteSuggestions() {
      const { input, box } = inviteEls();
      if (!input || !box) return;
      const open = inviteHits.length > 0;
      box.classList.toggle('hidden', !open);
      input.setAttribute('aria-expanded', String(open));
      box.innerHTML = inviteHits.map((u, i) => `
        <li role="option" id="invite-opt-${i}" aria-selected="${i === inviteAt}"
            onmousedown="event.preventDefault(); pickInvite(${i})"
            class="px-3 py-2 text-sm cursor-pointer"
            style="${i === inviteAt ? 'background: var(--fill)' : ''}">@${esc(u)}</li>`).join('');
      // A screen reader follows the highlight through aria-activedescendant,
      // not through the background colour above — without it, arrowing down
      // the list announces nothing at all.
      if (inviteAt >= 0) {
        input.setAttribute('aria-activedescendant', 'invite-opt-' + inviteAt);
        const opt = box.children[inviteAt];
        if (opt && opt.scrollIntoView) opt.scrollIntoView({ block: 'nearest' });
      } else {
        input.removeAttribute('aria-activedescendant');
      }
    }

    function closeInviteSuggestions() {
      const { input, box } = inviteEls();
      inviteHits = []; inviteAt = -1;
      if (box) { box.classList.add('hidden'); box.innerHTML = ''; }
      if (input) {
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
      }
    }

    // A tap anywhere outside the box dismisses it (the options themselves cancel
    // their mousedown, so picking one never trips this first).
    document.addEventListener('click', e => {
      if (inviteHits.length && !e.target.closest('#invite-suggest, #invite-input')) closeInviteSuggestions();
    });

    function pickInvite(i) {
      const { input } = inviteEls();
      const pick = inviteHits[i];
      if (!input || !pick) return;
      // Takes the directory's spelling, not the inviter's.
      input.value = pick;
      closeInviteSuggestions();
      setInviteNote('');
      setInviteBlocked(false);
      input.focus();
    }

    // ↓/↑ move through the list, Enter takes the highlighted one (and otherwise
    // falls through to the form's submit), Escape closes without clearing.
    function onInviteKey(ev) {
      if (ev.key === 'Escape') {
        if (inviteHits.length) { ev.stopPropagation(); closeInviteSuggestions(); }
        return;
      }
      if (!inviteHits.length) return;
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const step = ev.key === 'ArrowDown' ? 1 : -1;
        // Nothing highlighted yet (-1): ↓ takes the first, ↑ takes the last.
        inviteAt = inviteAt < 0 && step < 0
          ? inviteHits.length - 1
          : (inviteAt + step + inviteHits.length) % inviteHits.length;
        renderInviteSuggestions();
      } else if (ev.key === 'Enter' && inviteAt >= 0) {
        ev.preventDefault();
        pickInvite(inviteAt);
      }
    }

    function inviteMember(ev) {
      ev.preventDefault();
      if (!isOnline()) { requireOnline(); return false; }
      if (inviteBlocked) return false;
      const form = ev.target;
      const input = form.elements.username;
      const username = input.value.trim();
      if (!username) return false;
      closeInviteSuggestions();
      withBusy(form, async () => {
        try {
          const reply = await api('/api/lists/' + current.list.id + '/members', {
            method: 'POST', body: JSON.stringify({ username }), timeoutMs: MUTATION_TIMEOUT_MS,
          });
          // This handle's cached search result is now stale — they are a member.
          inviteCache.delete(username.replace(/^@/, '').toLowerCase());
          current = await api('/api/lists/' + current.list.id, { timeoutMs: LOAD_TIMEOUT_MS });
          renderList(current);
          renderMembers(); // modal stays open; refresh its body
          const handle = '@' + username.replace(/^@/, '');
          // Say so when the name could not be checked, rather than implying it was.
          toast(reply && reply.unverified
            ? handle + ' added — we couldn’t check that name right now.'
            : handle + ' added');
        } catch (e) { reportWriteError(e); }
      });
      return false;
    }

    async function removeMember(memberId, btn) {
      if (!requireOnline()) return;
      await withBusy(btn, async () => {
        try {
          await api('/api/lists/' + current.list.id + '/members/' + memberId, {
            method: 'DELETE', timeoutMs: MUTATION_TIMEOUT_MS,
          });
          current = await api('/api/lists/' + current.list.id, { timeoutMs: LOAD_TIMEOUT_MS });
          renderList(current);
          renderMembers(); // modal stays open; refresh its body
        } catch (e) { reportWriteError(e); }
      });
    }

    applyTheme();
    renderStrip();
    // A queue left over from a previous session: arm the row/strip hints and
    // start sending before anything else, so the first paint is already honest
    // about what hasn't reached the server.
    if (queueLength()) { syncHints(true); drain(); }
    route();

    // --- service worker ---------------------------------------------------------
    // Caches the app shell (and, opportunistically, the hosted CSS/JS it needs)
    // so a cold start with no connection still boots into the saved copy.
    // Entirely best-effort: registration is unavailable in some third-party
    // iframe contexts, and when it fails the in-session offline layer above is
    // unchanged. Never logs at error level — a console error would fail the
    // platform's baseline proposal check.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            // `update()` REJECTS when it cannot fetch /sw.js — which is every
            // offline load, and is entirely expected there. A sync try/catch
            // never sees that, so the rejection went unhandled and the browser
            // logged "ServiceWorker script load failed" as a console error: an
            // alarming message for normal behaviour, and one the platform's
            // baseline "loads with no console errors" check would fail on.
            reg.update().catch(() => { /* offline, or the script is unchanged */ });
            // Keep the offline fallback in step with deploys that change only
            // the shell (sw.js unchanged means no activate pass).
            const worker = reg.active || navigator.serviceWorker.controller;
            if (worker) worker.postMessage('refresh-shell');
          })
          .catch(() => { /* unsupported or blocked — the app still works online */ });
      });
    }

    // Pull-to-refresh on the window scroller — the kit rubber-bands #app, holds
    // its spinner until the refresh promise settles, and no-ops on desktop.
    // Detached while a modal is open (see lockPage) and re-attached on dismiss,
    // so a drag inside a modal never pulls the page behind it.
    function attachPtr() {
      if (!window.unNative || ptrHandle) return;
      ptrHandle = unNative.attachPullToRefresh(
        window,
        () => (current ? refreshList() : refreshHome()),
        { content: document.getElementById('app') }
      );
    }
    attachPtr();
  </script>
</body>
</html>
