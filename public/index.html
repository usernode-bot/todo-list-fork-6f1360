    // are painting can wait longer than a write we are going to retry anyway.
    async function api(path, opts = {}) {
      const { timeoutMs = 10000, ...init } = opts;
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      let timedOut = false;
      const timer = ctl
        ? setTimeout(() => { timedOut = true; ctl.abort(); }, timeoutMs)
        : null;
      let res;
      try {
        res = await fetch(path, {
          ...init,
          ...(ctl ? { signal: ctl.signal } : {}),
          headers: { 'Content-Type': 'application/json', ...headers, ...(opts.headers || {}) },
        });
      } catch (_) {
        if (timedOut) {
          // The connection is up but not answering. Tagged as a network error
          // so queued writes still retry, and as a timeout so callers can say
          // "we don't know" instead of "that failed".
          markSlow();
          const err = new Error("The connection is slow — we'll keep trying.");
          err.network = true;
          err.timeout = true;
          throw err;
        }
        // fetch itself rejected — no connection. Tag the error so callers can
        // tell "offline" apart from a server-side rejection.
        markOffline();
        const err = new Error("You're offline");
        err.network = true;
        throw err;
      } finally {
        if (timer) clearTimeout(timer);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        // Carry the status so the replay loop can tell a permanent rejection
        // (the item was deleted) from one worth retrying (502, 429).
        const err = new Error(data.error || ('Request failed (' + res.status + ')'));
        err.status = res.status;
        throw err;
      }
      // Any call that came back is a successful round trip to the server —
      // which is exactly what the Offline & storage read-out means by it.
      lastSyncAt = Date.now();
      // A successful call proves we're back — but never fight the replay loop
      // for the strip while it is mid-drain.
      if ((connState === 'offline' || connState === 'slow') && !replaying && !queueLength()) markOnline();
      return data;
    }

    // Transient feedback — the kit's toast (bottom capsule HUD on
    // iOS/desktop, Material snackbar on Android; singleton, auto-hiding).
    function toast(msg) {
      if (window.unNative) unNative.toast(msg);
      else console.warn('[toast]', msg);
    }

    // --- offline layer --------------------------------------------------------
    // Read cache: the last good payload of Home and of each opened list, so a
    // dead connection shows the saved copy instead of an error screen. The app
    // shell itself is cached by /sw.js, so this survives a cold start too.
    // Mutation queue: the daily-use ops (add / toggle / edit / delete item)
    // apply optimistically and queue while offline, then replay in order on
    // reconnect. Everything else (reorders, categories, lists, members,
    // import) stays online-only and says so before it is attempted.
    const QUEUE_KEY = NS + 'queue';
    const HOME_KEY = NS + 'cache:home';
    const LRU_KEY = NS + 'cache:lru';
    const listKey = id => NS + 'cache:list:' + id;
    const MAX_CACHED_LISTS = 10;

    // --- storage mode (issue #47) ----------------------------------------------
    // Every cache write used to be a silent try/catch, so a device that refuses
    // the app durable storage — the realistic case being this cross-origin
    // iframe under iOS/WKWebView's third-party storage rules — got NO saved
    // copy and NO durable queue, while the status strip went right on promising
    // "showing saved copy" and "3 changes will sync". Probe once, then be
    // honest about which of the two worlds we are in.
    //
    // 'disk'   — localStorage works; everything persists across a cold start.
    // 'memory' — it doesn't; back the same interface with a Map so the session
    //            still works end to end, and change what the strip claims.
    const memStore = new Map();
    const STORAGE_MODE = (function probeStorage() {
      if (shotNostore) return 'memory'; // display-only screenshot state
      try {
        const probe = 'todo:__probe';
        localStorage.setItem(probe, '1');
        const ok = localStorage.getItem(probe) === '1';
        localStorage.removeItem(probe);
        return ok ? 'disk' : 'memory';
      } catch (_) { return 'memory'; }
    })();
    const DURABLE = STORAGE_MODE === 'disk';

    // The two primitives everything else in the offline layer is built on.
    // Neither ever throws; `cacheSet` returning false is the caller's signal
    // that the intent could not be persisted.
    function rawGet(key) {
      if (!DURABLE) return memStore.has(key) ? memStore.get(key) : null;
      try { return localStorage.getItem(key); } catch (_) { return null; }
    }
    function rawSet(key, val) {
      if (!DURABLE) { memStore.set(key, val); return true; }
      try { localStorage.setItem(key, val); return true; } catch (_) { return false; }
    }
    function rawRemove(key) {
      if (!DURABLE) { memStore.delete(key); return; }
      try { localStorage.removeItem(key); } catch (_) {}
    }

    // Adopt the pre-namespace keys under this user, then drop every other
    // user's namespace so a shared browser never leaks between accounts.
    //
    // The sweep is gated on HAVE_TOKEN_IDENTITY: deleting another namespace is
    // only safe when the platform has actually told us who we are this load.
    // On a token-less load we know nothing, so we touch nothing — that is the
    // whole of the issue #47 data-loss fix.
    (function migrateStorage() {
      if (!DURABLE) return;
      try {
        for (const [from, to] of [['todo:queue', QUEUE_KEY], ['todo:cache:home', HOME_KEY]]) {
          const v = localStorage.getItem(from);
          if (v == null) continue;
          if (localStorage.getItem(to) == null) localStorage.setItem(to, v);
          localStorage.removeItem(from);
        }
        for (const k of Object.keys(localStorage)) {
          if (/^todo:cache:list:\d+$/.test(k)) {
            const to = NS + k.slice('todo:'.length);
            if (localStorage.getItem(to) == null) localStorage.setItem(to, localStorage.getItem(k));
            localStorage.removeItem(k);
          } else if (HAVE_TOKEN_IDENTITY && /^todo:u[^:]+:/.test(k) && k.indexOf(NS) !== 0) {
            localStorage.removeItem(k);
          }
        }
      } catch (_) { /* storage full mid-sweep — the app still runs */ }
    })();

    // A census taken ONCE, before this load writes anything. It is the only
    // way to tell three failure modes apart from the outside, and they need
    // completely different fixes:
    //   ours = 0        storage did not survive the last session at all
    //   ours > 0, mine = 0   it survived, but this load is looking under a
    //                        different namespace than the one that wrote it
    //   mine > 0, no home    it is there and we simply never saved Home
    // Read by the Offline & storage read-out; costs one pass at boot.
    const BOOT_STORAGE = (function census() {
      const out = { ours: 0, mine: 0 };
      if (!DURABLE) return out;
      try {
        for (const k of Object.keys(localStorage)) {
          if (k.indexOf('todo:') !== 0) continue;
          out.ours++;
          if (k.indexOf(NS) === 0) out.mine++;
        }
      } catch (_) { /* enumeration denied — leave the zeros */ }
      return out;
    })();

    // Reclaim list payloads that nothing points at. The background pass used
    // to write the payload before asking the LRU for room, so a device that
    // ran that version is carrying saved lists no eviction path can reach —
    // they outlive the cap and they outlive the list being deleted. A payload
    // is only ever written alongside its LRU entry, so "not in the LRU" is
    // exactly the set that leaked. Costs one pass at boot, and on a device
    // that never leaked it removes nothing.
    //
    // Deliberately AFTER the census above, which promises a count taken before
    // this load writes anything — reclaiming is a write, and the read-out
    // would otherwise report a number no later look could reproduce.
    (function sweepOrphanedLists() {
      if (!DURABLE) return;
      try {
        const known = new Set((cacheGet(LRU_KEY) || []).map(String));
        const prefix = NS + 'cache:list:';
        for (const k of Object.keys(localStorage)) {
          if (k.indexOf(prefix) !== 0) continue;
          if (!known.has(k.slice(prefix.length))) rawRemove(k);
        }
      } catch (_) { /* enumeration denied — nothing to reclaim */ }
    })();

    // Set when a save of the Home copy was ATTEMPTED and refused (quota, or a
    // storage that accepts the probe and rejects real writes). Without this a
    // failed save is indistinguishable from one that never happened.
    let homeSaveFailed = false;

    function cacheSet(key, val) {
      return rawSet(key, JSON.stringify(val));
    }
    function cacheGet(key) { try { return JSON.parse(rawGet(key)); } catch (_) { return null; } }

    // A write that must not be lost (the queue) evicts cached list payloads
    // oldest-first — never the list on screen — and retries after each one.
    function cacheSetOrEvict(key, val) {
      if (cacheSet(key, val)) return true;
      const keepId = current ? String(current.list.id) : null;
      const lru = cacheGet(LRU_KEY) || [];
      for (let i = lru.length - 1; i >= 0; i--) {
        const id = String(lru[i]);
        if (id === keepId) continue;
        rawRemove(listKey(id));
        lru.splice(i, 1);
        cacheSet(LRU_KEY, lru);
        if (cacheSet(key, val)) return true;
      }
      rawRemove(HOME_KEY);
      return cacheSet(key, val);
    }

    // Most-recently-opened list ids, newest first; the tail is what eviction
    // and the MAX_CACHED_LISTS cap consume.
    function touchList(id) {
      const key = String(id);
      const lru = [key, ...(cacheGet(LRU_KEY) || []).filter(x => String(x) !== key)];
      for (const stale of lru.slice(MAX_CACHED_LISTS)) {
        rawRemove(listKey(stale));
      }
      cacheSet(LRU_KEY, lru.slice(0, MAX_CACHED_LISTS));
    }

    // Prefetch's counterpart to touchList. A list saved in the background was
    // NOT opened, so it joins the tail rather than the head: an explicitly
    // opened list always outranks one we merely saved, and is evicted last.
    // Returns false when the cap leaves no room, which is the caller's signal
    // to stop rather than start evicting the user's own lists.
    function rememberSaved(id) {
      const key = String(id);
      const lru = cacheGet(LRU_KEY) || [];
      if (lru.some(x => String(x) === key)) return true;
      if (lru.length >= MAX_CACHED_LISTS) return false;
      lru.push(key);
      return cacheSet(LRU_KEY, lru);
    }

    // Give the slot back. Used when the payload write fails after the slot was
    // reserved — without it the cap would be spent on a list that isn't
    // actually saved, and the next pass would see a full LRU and stop.
    function forgetSaved(id) {
      const key = String(id);
      cacheSet(LRU_KEY, (cacheGet(LRU_KEY) || []).filter(x => String(x) !== key));
    }

    // What the server last said about each saved copy: `{ at, fp }` — when it
    // was read, and a fingerprint of what came back.
    //
    // In its own key rather than inside the payload, because loadList compares
    // JSON.stringify(the saved copy) against a fresh fetch to decide whether
    // to repaint — a stamp carried in the payload would make every one of
    // those comparisons differ and repaint the screen for nothing.
    //
    // Holding `fp` here rather than deriving it from the payload is what keeps
    // the staleness check below off the hot path: the alternative reads and
    // parses every saved list on every single Home load, and Home is the
    // screen this app works hardest to paint quickly.
    //
    // Written where server data lands (loadList, refreshList, the background
    // pass) — NOT in cacheList, which also runs on every local toggle and
    // edit. A local change does not make a copy any fresher than the server,
    // and recording it as if it did is exactly what would let a stale list
    // hide behind its own edits.
    const SAVED_AT_KEY = NS + 'cache:saved-at';
    function savedAtMap() {
      const m = cacheGet(SAVED_AT_KEY);
      return m && typeof m === 'object' && !Array.isArray(m) ? m : {};
    }
    // Self-pruning: every write drops entries for lists the LRU no longer
    // holds, so this map can never outgrow MAX_CACHED_LISTS or outlive the
    // payloads it describes.
    //
    // `payload` must be what the SERVER returned, not the copy with unsent
    // changes projected onto it: this records what the server last said.
    function stampFetched(id, payload) {
      const known = new Set((cacheGet(LRU_KEY) || []).map(String));
      const prev = savedAtMap();
      const next = {};
      for (const k of Object.keys(prev)) if (known.has(k)) next[k] = prev[k];
      next[String(id)] = { at: Date.now(), fp: savedFingerprint(payload) };
      cacheSet(SAVED_AT_KEY, next);
    }

    function cacheList() {
      if (!current) return;
      cacheSetOrEvict(listKey(current.list.id), current);
      touchList(current.list.id);
    }

    function loadQueue() { return cacheGet(QUEUE_KEY) || []; }
    // Returns false when the change could NOT be persisted — callers must then
    // revert their optimistic update rather than pretend it is queued.
    function saveQueue(q) {
      const ok = cacheSetOrEvict(QUEUE_KEY, q);
      pendingIds = null;
      syncHints(queueLength() > 0);
      renderStrip();
      return ok;
    }
    function queueLength() { return loadQueue().length; }

    // Which items have unsent changes. Derived from the queue (the queue is the
    // truth), memoised because every row render asks.
    let pendingIds = null;
    function pendingItemIds() {
      if (shotPendingIds) return shotPendingIds;
      if (!pendingIds) pendingIds = new Set(loadQueue().map(o => o.itemId));
      return pendingIds;
    }

    // Nothing flashes for a change that lands quickly: a row only admits it is
    // waiting, and the strip only says "Saving…", once an op has been unsent
    // for a beat. On a fast connection neither timer ever fires.
    let pendingShown = false, savingShown = false;
    let pendingHintTimer = null, savingHintTimer = null;
    function syncHints(queued) {
      if (queued) {
        if (!savingShown && !savingHintTimer) {
          savingHintTimer = setTimeout(() => {
            savingHintTimer = null; savingShown = true;
            // A drain still going at this point is one the user can see, so it
            // also earns the "All changes synced" confirmation when it lands.
            if (replaying) drainVisible = true;
            renderStrip();
          }, BUSY_HINT_MS);
        }
        if (!pendingShown && !pendingHintTimer) {
          pendingHintTimer = setTimeout(() => {
            pendingHintTimer = null; pendingShown = true;
            if (current) repaintAllCategories();
          }, PENDING_HINT_MS);
        }
        return;
      }
      clearTimeout(savingHintTimer); savingHintTimer = null; savingShown = false;
      clearTimeout(pendingHintTimer); pendingHintTimer = null;
      if (pendingShown) {
        pendingShown = false;
        if (current) repaintAllCategories();
      }
    }

    // 'online' | 'slow' | 'offline' | 'syncing' | 'blocked'. 'slow' is a live
    // connection that isn't answering in time: writes are safe (they're
    // queued), so it is a note, not an error. 'blocked' = the server refused
    // our token, so the queue waits for a fresh one.
    let connState = navigator.onLine === false ? 'offline' : 'online';
    // Whether what is ON SCREEN came out of the cache. The strip used to say
    // "showing saved copy" from the fact that storage WORKS, which is a
    // different question — so an offline boot with an empty cache promised a
    // saved copy while the screen said "You're offline".
    let showingSaved = false;
    const isOnline = () => connState !== 'offline';
    // Read by the Offline & storage read-out. Not persisted: "last sync" is a
    // fact about this session, and a stale one from three days ago would read
    // as reassurance rather than information.
    let lastSyncAt = null;
    // Said once per session, the first time being offline actually costs the
    // user something on a device that won't let us save anything.
    let nostoreWarned = false;
    function markOffline() {
      if (connState !== 'offline') connState = 'offline';
      if (!DURABLE && !nostoreWarned) {
        nostoreWarned = true;
        toast("This device isn't allowing offline storage — changes are kept only until you close the app.");
      }
      renderStrip();
      scheduleReplay();
    }
    // A timed-out request. Never downgrades 'offline' or 'blocked' — those are
    // more specific, and both already keep the queue retrying.
    function markSlow() {
      if (connState !== 'offline' && connState !== 'blocked') connState = 'slow';
      renderStrip();
    }
    function markOnline() { connState = 'online'; lastSyncAt = Date.now(); renderStrip(); }

    // Transient "All changes synced" confirmation.
    let stripFlash = null, stripFlashTimer = null;
    function flashSynced() {
      stripFlash = 'All changes synced';
      renderStrip();
      clearTimeout(stripFlashTimer);
      stripFlashTimer = setTimeout(() => { stripFlash = null; renderStrip(); }, 2200);
    }

    const plural = n => n + ' change' + (n === 1 ? '' : 's');

    // The single source of truth for the status strip. `?shot=` short-circuits
    // it with a fixed label so the screenshot state is deterministic.
    function stripState() {
      if (shot === 'offline') return { text: 'Offline — showing saved copy' };
      if (shot === 'syncing') return { text: 'Syncing 2 changes…' };
      if (shot === 'slow') return { text: 'Slow connection — 2 changes will sync', tap: true };
      if (shot === 'nostore') return { text: 'Offline — changes will be lost if you close the app' };
      if (shot === 'nocache') return { text: 'Offline — nothing saved on this device yet' };
      if (stripFlash) return { text: stripFlash, ok: true };
      const n = queueLength();
      if (connState === 'blocked') return { text: "Couldn't sync — tap to retry", tap: true };
      if (connState === 'offline') {
        // Memory-only storage: never promise a saved copy we don't have, and
        // never claim a queued change "will sync" when closing the app drops it.
        if (!DURABLE) return { text: 'Offline — changes will be lost if you close the app' };
        if (n) return { text: 'Offline — ' + plural(n) + ' will sync' };
        // Same rule for the copy itself: only claim one when one is on screen.
        return { text: showingSaved
          ? 'Offline — showing saved copy'
          : 'Offline — nothing saved on this device yet' };
      }
      if (connState === 'slow') {
        return n
          ? { text: 'Slow connection — ' + (DURABLE ? plural(n) + ' will sync' : plural(n) + ' waiting'), tap: true }
          : { text: 'Slow connection…' };
      }
      // A drain in progress. Silent unless it is a real catch-up or it has
      // already taken longer than a beat — otherwise every single tap would
      // flash the strip for 200ms on a healthy connection.
      if (connState === 'syncing') {
        if (!drainVisible && !savingShown) return null;
        if (!drainVisible && n <= 1) return { text: 'Saving…' };
        return { text: 'Syncing ' + plural(Math.max(n, 1)) + '…' };
      }
      // Queued but not currently sending (between retries, or just committed).
      if (n) {
        if (!savingShown) return null;
        return n === 1
          ? { text: 'Saving…' }
          : { text: plural(n) + ' waiting to sync', tap: true };
      }
      return null;
    }

    function renderStrip() {
      const chip = document.getElementById('offline-chip');
      const st = stripState();
      // Dimming of connection-only controls tracks the real state (or the
      // screenshot override, which is the whole point of the shot link).
      document.body.classList.toggle('is-offline',
        connState === 'offline' || shot === 'offline' || shot === 'nostore'
        || shot === 'nocache');
      // Keep the strip's anchor in step with whether a nav bar is on screen.
      document.body.classList.toggle('no-navbar', !document.querySelector('.un-navbar'));
      if (!chip) return;
      if (!st) {
        chip.classList.add('hidden');
        chip.classList.remove('tappable', 'ok');
        chip.textContent = ''; // don't leave stale text in the a11y tree
        document.body.classList.remove('has-strip');
        return;
      }
      chip.textContent = st.text;
      chip.classList.remove('hidden');
      chip.classList.toggle('tappable', !!st.tap);
      chip.classList.toggle('ok', !!st.ok);
      document.body.classList.add('has-strip');
    }

    function onStripTap() {
      const st = stripState();
      if (st && st.tap) drain(true);
    }

    // Locally-created items get negative ids until a reply maps them; seeding
    // from the clock avoids collisions with ids left in a persisted queue.
    let tempSeq = -(Date.now() % 1e9) - 1;
    const isTempId = id => id < 0;

    // Per-op idempotency key, sent with creates so a retried add can't insert
    // twice (see items.client_op_id server-side). The tab id is random per
    // load, so keys stay unique across reloads as well as within one.
    let opSeq = 0;
    const newOpId = () => clientId + '-' + (++opSeq);

    const STORAGE_FULL = "Not enough storage to save this change offline.";

    // Records an item mutation. The caller has ALREADY applied it on screen —
    // this only persists the intent and kicks the sender, so the network is
    // never in the interaction path whatever the connection is doing. Returns
    // false when the intent could not be persisted, which is the caller's
    // signal to put the row back.
    function commit(op) {
      op.opId = op.opId || newOpId();
      op.attempts = 0;
      if (!saveQueue(coalesce(loadQueue(), op))) { toast(STORAGE_FULL); return false; }
      drain();
      return true;
    }

    // Collapses redundant ops, so holding a checkbox or renaming twice sends
    // one request rather than a burst. The op at index 0 is left alone while it
    // is in flight: rewriting the body a request is already carrying would
    // silently drop the newer value.
    function coalesce(q, op) {
      const first = replaying ? 1 : 0;
      if (op.type === 'toggle' || op.type === 'edit' || op.type === 'due') {
        // Last write wins per item — but keep the ORIGINAL op's undo payload,
        // which is the state before the whole burst started.
        for (let i = q.length - 1; i >= first; i--) {
          if (q[i].type === op.type && q[i].itemId === op.itemId) {
            q[i] = { ...op, opId: q[i].opId, undo: q[i].undo || op.undo };
            return q;
          }
        }
      } else if (op.type === 'delete') {
        // A delete supersedes every unsent change to that item. If its create
        // is still queued the item never reached the server at all, so both
        // ops simply disappear.
        let cancelsAdd = false;
        for (let i = q.length - 1; i >= first; i--) {
          if (q[i].itemId !== op.itemId) continue;
          if (q[i].type === 'add') cancelsAdd = true;
          q.splice(i, 1);
        }
        if (cancelsAdd) return q;
      }
      q.push(op);
      return q;
    }

    // Rolls a permanently rejected op back off the screen and out of the cache,
    // so the view is right even when there's no connection to refetch with.
    function applyUndo(op) {
      if (!op || !current) return;
      const u = op.undo;
      if (op.type === 'add') {
        current.items = current.items.filter(i => i.id !== op.itemId);
      } else if (op.type === 'delete') {
        if (!u || current.items.some(i => i.id === op.itemId)) return;
        current.items.push({ ...u, id: op.itemId });
      } else {
        if (!u) return;
        const idx = current.items.findIndex(i => i.id === op.itemId);
        if (idx === -1) return;
        current.items[idx] = { ...current.items[idx], ...u };
      }
      cacheList();
      repaintAllCategories();
    }

    // --- replay ----------------------------------------------------------------
    // Retry cadence: a steady 15s poll while offline, escalating backoff after a
    // retriable server error so a struggling backend isn't hammered.
    const REPLAY_IDLE_MS = 15000, BACKOFF_START = 5000, BACKOFF_MAX = 30000;
    const MAX_OP_ATTEMPTS = 5;
    let replayTimer = null, replaying = false, backoffMs = BACKOFF_START;

    function scheduleReplay(delay) {
      clearTimeout(replayTimer);
      replayTimer = setTimeout(() => { replayTimer = null; drain(); }, delay || REPLAY_IDLE_MS);
    }
    function stopReplayTimer() { clearTimeout(replayTimer); replayTimer = null; }

    // `navigator.onLine` only reports the interface, so confirm with the public
    // /health endpoint before claiming we're back. On its own deadline: a probe
    // that hasn't answered in 3s has answered.
    async function reachable() {
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = ctl ? setTimeout(() => ctl.abort(), HEALTH_TIMEOUT_MS) : null;
      try {
        const res = await fetch('/health', { cache: 'no-store', ...(ctl ? { signal: ctl.signal } : {}) });
        return res.ok;
      } catch (_) {
        return false;
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    // Sends one op. Consumes the queue head on success (the `add` branch also
    // rewrites later ops that reference its temp id, persisted so the mapping
    // survives a reload, and adopts the real id into the row on screen).
    async function runOp(op) {
      if (op.type === 'add') {
        const data = await api(op.path, {
          method: 'POST',
          body: JSON.stringify({ ...op.body, client_op_id: op.opId }),
          timeoutMs: MUTATION_TIMEOUT_MS,
        });
        saveQueue(loadQueue().slice(1).map(o =>
          o.itemId === op.itemId ? { ...o, itemId: data.item.id } : o));
        adoptServerItem(op.itemId, data);
        return;
      }
      if (op.type === 'toggle' || op.type === 'edit' || op.type === 'due') {
        if (!isTempId(op.itemId)) {
          await api('/api/items/' + op.itemId, {
            method: 'PATCH', body: JSON.stringify(op.body), timeoutMs: MUTATION_TIMEOUT_MS,
          });
        }
      } else if (op.type === 'delete') {
        if (!isTempId(op.itemId)) {
          await api('/api/items/' + op.itemId, { method: 'DELETE', timeoutMs: MUTATION_TIMEOUT_MS });
        }
      }
      saveQueue(loadQueue().slice(1));
    }

    // The row was created locally with a temp id; take the server's id (and its
    // canonical fields) in place. Repaint ONLY when something visible changed —
    // a bare id swap must not make rows jump under the user's finger, and the
    // per-category adder input would lose focus mid-typing.
    function adoptServerItem(tempId, data) {
      if (!current || !data || !data.item) return;
      if (data.category && !current.categories.some(c => c.id === data.category.id)) {
        current.categories.unshift(data.category);
      }
      const idx = current.items.findIndex(i => i.id === tempId);
      if (idx === -1) { cacheList(); return; }
      const local = current.items[idx], item = data.item;
      const visiblyChanged = local.text !== item.text
        || !!local.checked !== !!item.checked
        || local.category_id !== item.category_id;
      current.items[idx] = { ...local, ...item };
      // A due date set on the row while its create was still in flight is not
      // on the server yet (its own op is queued behind this one), so the
      // server's NULLs must not wipe the chip the user is looking at.
      if (loadQueue().some(o => o.type === 'due' && o.itemId === tempId)) {
        current.items[idx].due_date = local.due_date;
        current.items[idx].due_time = local.due_time;
      }
      // Undo history holds ids too — re-point it, or the first undo after a
      // create lands would address a row that no longer exists.
      remapHistoryId(tempId, item.id);
      cacheList();
      if (visiblyChanged) { repaintAllCategories(); return; }
      // Row handlers all resolve their id from data-item at tap time, so
      // re-pointing the attribute is the whole of the swap.
      const row = document.querySelector('#cats .item-row[data-item="' + tempId + '"]');
      if (row) row.dataset.item = String(item.id);
      else repaintAllCategories();
    }

    // Fire-and-forget sender. Never rejects: a failure here is a connection
    // state, not an exception for the caller to handle.
    function drain(force) { attemptReplay(force).catch(() => {}); }

    let drainVisible = false;

    async function attemptReplay(force) {
      if (replaying) return;
      if (!queueLength()) {
        if (connState === 'blocked') markOnline();
        // Nothing pending, but while offline keep probing so the strip clears
        // itself the moment the connection is back — no user action needed.
        if (connState === 'offline') {
          if (await reachable()) markOnline();
          else { scheduleReplay(); return; }
        }
        stopReplayTimer();
        renderStrip();
        return;
      }
      if (!force && navigator.onLine === false) { markOffline(); return; }
      // Fast lane: only probe /health when we believe we are offline. Probing
      // before every change would put a whole extra round trip in front of
      // every tap, which is exactly the latency this change removes.
      if ((connState === 'offline' || force) && !(await reachable())) { markOffline(); return; }

      replaying = true;
      // A catch-up drain (recovering from a bad connection) announces itself
      // immediately; an ordinary one stays silent unless it turns out slow.
      const wasDegraded = connState === 'offline' || connState === 'slow' || connState === 'blocked';
      drainVisible = wasDegraded;
      connState = 'syncing';
      renderStrip();
      let dropped = 0, drained = false;
      try {
        while (true) {
          const q = loadQueue();
          if (!q.length) { drained = true; break; }
          const op = q[0];
          try {
            await runOp(op);
          } catch (e) {
            // Timed out: the connection is alive but crawling. Hold the op (it
            // may even have landed — client_op_id makes the retry safe) and
            // back off instead of declaring the app offline.
            if (e.timeout) { markSlow(); scheduleReplay(BACKOFF_START); return; }
            if (e.network) { markOffline(); scheduleReplay(); return; }
            const status = e.status || 0;
            if (status === 401) {
              // Token expired / not accepted — keep every op and wait for a
              // reload inside the platform shell to mint a fresh one.
              connState = 'blocked';
              renderStrip();
              scheduleReplay(BACKOFF_MAX);
              return;
            }
            if (status === 429 || status >= 500) {
              const attempts = (op.attempts || 0) + 1;
              if (attempts < MAX_OP_ATTEMPTS) {
                const q2 = loadQueue();
                q2[0] = { ...op, attempts };
                saveQueue(q2);
                backoffMs = Math.min(backoffMs * 2, BACKOFF_MAX);
                connState = 'online';
                renderStrip();
                scheduleReplay(backoffMs);
                return;
              }
              // Out of attempts: drop it rather than let a poisoned head
              // block every later change forever.
              dropped++;
              saveQueue(loadQueue().slice(1));
              applyUndo(op);
              continue;
            }
            // 400 / 403 / 404 / 409 and friends: permanent (the item or list
            // was deleted elsewhere, or the edit is no longer valid). Roll the
            // change back on screen — it is never coming back from the server.
            dropped++;
            saveQueue(loadQueue().slice(1));
            applyUndo(op);
            continue;
          }
        }
        backoffMs = BACKOFF_START;
        stopReplayTimer();
        markOnline();
        // Only confirm a drain the user could see waiting; a change that landed
        // in 200ms doesn't need a banner telling them so.
        if (!dropped && drainVisible) flashSynced();
        if (current) refreshList(); else refreshHome();
      } finally {
        replaying = false;
        if (dropped) {
          toast(plural(dropped) + " couldn't be applied (the item was deleted)");
        }
        if (!drained && connState === 'syncing') { connState = 'online'; }
        renderStrip();
      }
    }

    window.addEventListener('online', () => drain(true));
    window.addEventListener('offline', markOffline);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (queueLength()) drain();
      // A remote change that arrived while the tab was hidden was deferred
      // rather than refetched; catch up now that there is something to see.
      if (liveRefreshPending) liveRefresh();
    });

    // Actions with no offline path say so BEFORE they are attempted.
    function requireOnline() {
      if (isOnline()) return true;
      toast("You're offline — this needs a connection.");
      return false;
    }

    // Local stand-in for the server's insert (top of the unchecked section).
    // Used for EVERY add, not just offline ones: the row is drawn from this and
    // then adopts the server's id when the reply lands.
    function localNewItem(id, categoryId, text, items) {
      const min = (items || current.items)
        .filter(i => i.category_id === categoryId && !i.checked)
        .reduce((m, i) => Math.min(m, i.sort_order), 1);
      return { id, category_id: categoryId, text, checked: false, sort_order: min - 1,
               completed_at: null, created_by: me, last_checked_by: null,
               due_date: null, due_time: null };
    }

    // Where the server would move a row inside its section after a toggle
    // (bottom of the section it lands in), so the optimistic position matches
    // what the next refetch will say.
    function sectionBottom(items, categoryId, checked, exceptId) {
      return items
        .filter(i => i.category_id === categoryId && !!i.checked === checked && i.id !== exceptId)
        .reduce((m, i) => Math.max(m, i.sort_order), 0) + 1;
    }

    // Re-projects still-unsent changes onto a freshly fetched payload. Without
    // this, any refetch (background reconcile, pull-to-refresh, a live update
    // from another member) would visibly undo an edit that is still queued.
    function applyPendingOps(d) {
      const q = loadQueue();
      if (!q.length || !d || !Array.isArray(d.items)) return d;
      for (const op of q) {
        const idx = d.items.findIndex(i => i.id === op.itemId);
        if (op.type === 'add') {
          if (idx !== -1) continue; // already landed server-side
          const m = /^\/api\/categories\/(\d+)\/items$/.exec(op.path);
          const bucket = d.categories.find(c => c.is_default) || d.categories[0];
          const catId = m ? +m[1] : (bucket && bucket.id);
          if (catId == null || !d.categories.some(c => c.id === catId)) continue;
          d.items.push(localNewItem(op.itemId, catId, op.body.text, d.items));
        } else if (idx === -1) {
          continue; // the row is gone server-side; the drain will sort it out
        } else if (op.type === 'delete') {
          d.items.splice(idx, 1);
        } else if (op.type === 'edit') {
          d.items[idx] = { ...d.items[idx], text: op.body.text };
        } else if (op.type === 'due') {
          d.items[idx] = { ...d.items[idx],
            due_date: op.body.due_date, due_time: op.body.due_time };
        } else if (op.type === 'toggle') {
          const it = d.items[idx], checked = !!op.body.checked;
          d.items[idx] = { ...it, checked,
            completed_at: checked ? (it.completed_at || new Date().toISOString()) : null,
            last_checked_by: checked ? (me || it.last_checked_by) : it.last_checked_by,
            sort_order: sectionBottom(d.items, it.category_id, checked, it.id) };
        }
      }
      return d;
    }

    // Platform detection from the kit's html classes; fall back to media
    // queries if native.js failed to load.
    const IS_TOUCH = document.documentElement.classList.contains('un-ios') ||
                     document.documentElement.classList.contains('un-android') ||
                     (!window.unNative &&
                       (window.matchMedia('(hover: none) and (pointer: coarse)').matches ||
                        'ontouchstart' in window));

    // Shared class strings — the palette flows from the CSS variables.
    const BTN_SOFT = 'bg-[var(--fill)] text-[color:var(--label)]';
    const DRAWER_ITEM = 'w-full flex items-center justify-between gap-3 text-left px-4 py-2.5 text-[15px] un-pressable hover:bg-[var(--fill)]';

    // Closed-padlock icon marking private (owner-only) lists; inherits text color.
    function lockSvg(size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="inline-block shrink-0"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
    }

    // Promise-based replacements for prompt()/confirm(), built on the kit.
    // Text prompts present as the kit alert (with its inset field);
    // destructive confirms present as an action sheet on touch and a
    // destructive alert on desktop. Native prompt/confirm are only the
    // degraded fallback when native.js failed to load.
    async function askText(title, value = '') {
      if (!window.unNative) { try { return prompt(title, value); } catch (_) { return null; } }
      const res = await unNative.alert({
        title,
        field: { value },
        buttons: [
          { label: 'Cancel', style: 'cancel' },
          { label: 'OK', style: 'default' },
        ],
      });
      if (!res || !res.button || res.button.style === 'cancel') return null;
      return res.value != null ? res.value : '';
    }

    async function askConfirm(title, okLabel = 'Delete') {
      if (!window.unNative) { try { return confirm(title); } catch (_) { return false; } }
      if (IS_TOUCH) {
        const chosen = await unNative.actionSheet({
          title,
          actions: [{ label: okLabel, destructive: true }],
          cancelLabel: 'Cancel',
        });
        return !!chosen;
      }
      const res = await unNative.alert({
        title,
        buttons: [
          { label: 'Cancel', style: 'cancel' },
          { label: okLabel, style: 'destructive' },
        ],
      });
      return !!(res && res.button && res.button.style === 'destructive');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Owner-inclusive people count with singular/plural wording.
    function memberLabel(total) {
      return total + ' member' + (total === 1 ? '' : 's');
    }

    // --- theme (light / dark / system) ----------------------------------------
    // Not NS-namespaced on purpose: the pre-paint script in <head> reads this
    // key before any identity is known, and a flash of the wrong theme is
    // worse than two accounts on one browser sharing a light/dark choice.
    const THEME_KEY = 'todo:theme';
    function themePref() {
      const v = rawGet(THEME_KEY);
      return v === 'light' || v === 'dark' ? v : 'system';
    }
    function applyTheme() {
      const pref = themePref();
      const dark = pref === 'dark' ||
        (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      // Keep the UA-level floor in step with the class — see the boot script.
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    }
    function themeLabel() {
      const pref = themePref();
      return pref === 'light' ? '☀️ Light' : pref === 'dark' ? '🌙 Dark' : '🌓 System';
    }
    function cycleTheme() {
      const order = ['system', 'light', 'dark'];
      const next = order[(order.indexOf(themePref()) + 1) % 3];
      if (next === 'system') rawRemove(THEME_KEY);
      else rawSet(THEME_KEY, next);
      applyTheme();
      updateThemeLabels();
    }
    function updateThemeLabels() {
      document.querySelectorAll('[data-theme-label]').forEach(b => {
        b.textContent = 'Theme: ' + themeLabel();
      });
      const homeBtn = document.getElementById('home-theme');
      if (homeBtn) homeBtn.textContent = themeLabel();
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (themePref() === 'system') applyTheme();
    });

    // --- show/hide completed preference (per user, localStorage) -------------
    // NS-namespaced for the same reason the read cache is (issue #47): two
    // accounts on one browser used to share this preference. The un-namespaced
    // key is read through once so nobody's existing setting flips on upgrade.
    const SHOW_COMPLETED_KEY = NS + 'showCompleted';
    (function migrateShowCompleted() {
      if (!DURABLE) return;
      try {
        const old = localStorage.getItem('todo:showCompleted');
        if (old != null && localStorage.getItem(SHOW_COMPLETED_KEY) == null) {
          localStorage.setItem(SHOW_COMPLETED_KEY, old);
        }
        if (old != null && HAVE_TOKEN_IDENTITY) localStorage.removeItem('todo:showCompleted');
      } catch (_) {}
    })();
    function showCompleted() {
      return rawGet(SHOW_COMPLETED_KEY) !== 'false'; // default: shown
    }

    function setShowCompleted(v) {
      rawSet(SHOW_COMPLETED_KEY, v ? 'true' : 'false');
      // The global setting resets any per-category overrides so changing it
      // always visibly applies everywhere.
      for (const k of Object.keys(catDoneOverrides)) delete catDoneOverrides[k];
      // Fully-completed categories default to COLLAPSED, so "Show all
      // completed" gives them an explicit override — otherwise tapping it
      // would change nothing on screen.
      if (v && current) {
        for (const c of current.categories) {
          if (isCatFullyDone(c.id)) setCatCollapsed(c.id, false);
        }
      }
      if (current) repaintAllCategories();
    }

    // A category with at least one item and nothing left unchecked.
    function isCatFullyDone(catId) {
      if (!current) return false;
      let open = 0, done = 0;
      for (const i of current.items) {
        if (i.category_id !== catId) continue;
        if (i.checked) done++; else open++;
      }
      return !open && done > 0;
    }

    // Per-category visibility of completed items (session-only override of the
    // global switch), toggled from the divider between active and done items
    // (or, for fully-completed categories, from the header row).
    const catDoneOverrides = {};

    // The header chevron collapses/expands only the category's completed
    // items — unchecked items always stay visible. It drives the same
    // per-category done-visibility state as the "N done" toggles, so all
    // affordances stay in sync.
    function catShowDone(catId) {
      if (catDoneOverrides[catId] !== undefined) return catDoneOverrides[catId];
      // "Finished categories start shut" is now the whole-category collapse
      // default (see catCollapsed) rather than a done-visibility special case —
      // otherwise an explicitly expanded finished category would render an
      // empty card, with every one of its items filtered out from under it.
      return showCompleted();
    }
    function toggleCatDone(catId) {
      // While a search is active, done-visibility is forced by the filter;
      // toggling would silently mutate the collapse state behind the search.
      if (searchActive()) return;
      catDoneOverrides[catId] = !catShowDone(catId);
      repaintCategory(catId);
    }

    // --- whole-category collapse (issue #48) -----------------------------------
    // The header chevron used to drive done-item visibility only, which meant
    // it was a no-op on the common category — one with nothing ticked yet. So
    // the name tap the issue asks for would have done nothing there. The
    // chevron and the name now collapse the WHOLE category; done-item
    // visibility keeps its own control (the "N done" divider row inside the
    // card), so the two ideas stop fighting over one arrow.
    //
    // Persisted per list, per category, under NS — local-only state, so it
    // works offline by construction and never needs a server round trip.
    const collapsedKey = listId => NS + 'collapsed:' + listId;
    let collapsedIds = null; // Set of category ids, lazily loaded for `current`

    function collapsedSet() {
      if (!current) return new Set();
      if (!collapsedIds) {
        collapsedIds = new Set((cacheGet(collapsedKey(current.list.id)) || []).map(Number));
      }
      return collapsedIds;
    }
    // Dropped whenever the open list changes, so one list's collapse state can
    // never bleed into another's.
    function resetCollapsed() { collapsedIds = null; }
    function persistCollapsed() {
      if (!current || !collapsedIds) return;
      cacheSet(collapsedKey(current.list.id), [...collapsedIds]);
    }

    function catCollapsed(catId) {
      const set = collapsedSet();
      if (set.has(Number(catId))) return true;
      if (set.has(-Number(catId))) return false; // explicit "keep open" marker
      // No stored preference: a finished category starts shut, exactly as it
      // did when the chevron only hid completed items.
      return isCatFullyDone(catId);
    }
    function setCatCollapsed(catId, v) {
      const set = collapsedSet();
      const id = Number(catId);
      set.delete(id); set.delete(-id);
      // Both directions are recorded explicitly: the default is derived
      // (isCatFullyDone), so "open" has to be storable to beat it.
      set.add(v ? id : -id);
      persistCollapsed();
    }
    function toggleCatCollapsed(catId) {
      // Same guard as toggleCatDone: mid-search the header renders without its
      // chevron and the filter owns what's visible, so don't mutate behind it.
      if (searchActive()) return;
      setCatCollapsed(catId, !catCollapsed(catId));
      repaintCategory(catId);
    }

    // Categories whose "Add an item…" input is currently revealed by the
    // header + button.
    const openAdders = new Set();

    // --- search (list view) ---------------------------------------------------
    // Live client-side filter over the open list — all items are already in
    // `current`, so each keystroke just re-renders #cats from memory.
    // Whitespace-only input counts as inactive.
    let searchQuery = '';
    // Consumed by the next loadList() — set only by the ?shot=search deep link.
    let pendingSearch = '';
    const searchActive = () => !!searchQuery.trim();
    const searchQ = () => searchQuery.trim().toLowerCase();

    // The mobile keyboard's check/done key dismisses the keyboard (a blur)
    // without submitting. On touch devices, accept whatever was typed when
    // the field blurs with content. Enter-submits clear the field *before*
    // awaiting the API call, so an Enter-then-blur sequence can't double-add.
    function commitOnBlur(ev) {
      if (!IS_TOUCH) return;
      const input = ev.target;
      if (!input.value.trim() || !input.form) return;
      if (input.form.requestSubmit) input.form.requestSubmit();
      else input.form.dispatchEvent(new Event('submit', { cancelable: true }));
    }

    function toggleAdder(catId) {
      const opening = !openAdders.has(catId);
      if (openAdders.has(catId)) openAdders.delete(catId);
      else openAdders.add(catId);
      // Opening the adder on a collapsed category auto-expands it — both the
      // whole-category collapse and the done-items one, so the row the user is
      // about to add is somewhere they can see it.
      if (opening && catCollapsed(catId)) setCatCollapsed(catId, false);
      if (opening && !catShowDone(catId)) catDoneOverrides[catId] = true;
      repaintCategory(catId);
      if (openAdders.has(catId)) {
        const input = document.querySelector('#cat-' + catId + ' input[name=text]');
        if (input) input.focus();
      }
    }

    // "No items yet" is the largest thing on an empty category and used to be
    // inert text, which read as "nothing to do here" (issue #44). It is now the
    // obvious way in: tapping it opens that category's adder. Already open —
    // e.g. a stray second tap — just puts the caret back.
    function emptyNoteTap(catId) {
      if (openAdders.has(catId)) {
        const input = document.querySelector('#cat-' + catId + ' input[name=text]');
        if (input) input.focus();
        return;
      }
      toggleAdder(catId);
    }

    // --- live updates (SSE) ----------------------------------------------------
    // While a list is open, subscribe to its event stream; any change made by
    // another client triggers a silent refetch. EventSource retries transient
    // drops itself (server sends retry: 3000); if the browser gives up on a
    // fatal error we reopen manually after the same delay.
    let es = null, esListId = null, esRetryTimer = null, liveRefreshTimer = null;

    function connectEvents(listId) {
      if (es && esListId === listId) return;
      disconnectEvents();
      esListId = listId;
      openStream();
    }

    function openStream() {
      if (!esListId) return;
      es = new EventSource('/api/lists/' + esListId + '/events?token=' +
                           encodeURIComponent(token) + '&clientId=' + clientId);
      es.onmessage = ev => {
        let data;
        try { data = JSON.parse(ev.data); } catch (_) { return; }
        if (data.sourceClient && data.sourceClient === clientId) return; // our own edit
        if (data.type === 'list-deleted') {
          toast('This list was deleted');
          location.hash = '#/';
          return;
        }
        // Coalesce bursts (imports, reorders) into a single refetch.
        clearTimeout(liveRefreshTimer);
        liveRefreshTimer = setTimeout(liveRefresh, 150);
      };
      es.onerror = () => {
        if (es && es.readyState === EventSource.CLOSED) {
          es = null;
          clearTimeout(esRetryTimer);
          esRetryTimer = setTimeout(openStream, 3000);
        }
      };
    }

    function disconnectEvents() {
      clearTimeout(esRetryTimer);
      clearTimeout(liveRefreshTimer);
      if (es) { es.close(); es = null; }
      esListId = null;
    }

    // A remote change wants a refetch — but not while the tab is hidden
    // (nothing to see, and on a slow link it competes with the drain for the
    // connection) and not mid-drain (which refetches when it finishes). Either
    // way the intent is remembered rather than dropped.
    let liveRefreshPending = false;
    function liveRefresh() {
      if (document.hidden || replaying) { liveRefreshPending = true; return; }
      liveRefreshPending = false;
      refreshList();
    }

    // --- routing --------------------------------------------------------------
    let current = null; // current list detail payload (List View) or null (Home)

    // Which screen is on-screen — drives the push/pop direction of the screen
    // transition. Only real Home ↔ List navigations animate; the initial load
    // and all in-place repaints render instantly.
    let lastScreen = null; // 'home' | 'list' | null (nothing rendered yet)

    // Real screen navigations go through the kit's View Transition wrapper
    // (push/pop slide; instant cut where unsupported). Repaints pass 'none'.
    function renderScreen(fn, type) {
      if (window.unNative) unNative.transition(fn, { type });
      else fn();
    }

    function route() {
      const m = location.hash.match(/^#\/list\/(\d+)$/);
      if (m) loadList(m[1]);
      else if (shotLoading) document.getElementById('app').innerHTML = listSkeleton();
      else if (shotPending) loadShotPending();
      else if (shotSearch) loadShotSearch();
      else if (shotModal) loadShotModal();
      else if (shotEmpty) loadShotEmpty();
      else if (shotUndo) loadShotUndo();
      else if (shotDue || shotDueEditor) loadShotDue();
      else if (shotSync) loadShotSync();
      else if (shotNocache) loadShotNocache();
      else if (shotCollapsed) loadShotCollapsed();
      else if (shotDrop) loadShotDrop();
      else if (shotDiag) loadShotDiag();
      else if (shotMenu) loadShotMenu();
      else loadHome();
    }
    window.addEventListener('hashchange', route);

    // Skeleton placeholders. Only ever used when there is NO saved copy of the
    // screen to paint — the shape of the screen is a better wait than a
    // centred "Loading…", and it means content lands without a layout jump.
    // aria-hidden with a live region alongside: a screen reader gets the one
    // useful word, not a tree of empty boxes.
    function skBar(w, h) {
      return '<span class="sk" style="width:' + w + ';height:' + (h || 13) + 'px"></span>';
    }
    function skRows(n) {
      let out = '';
      for (let i = 0; i < n; i++) {
        out += '<div class="un-group-row flex items-center gap-3 px-4 py-3">' +
               skBar('1.05rem', 18) + skBar((52 + ((i * 17) % 34)) + '%') + '</div>';
      }
      return out;
    }
    const SK_NAV_SPACER = '<div style="height: calc(3rem + env(safe-area-inset-top))"></div>';
    const SK_LIVE = '<p class="vis-hidden" role="status">Loading…</p>';

    function homeSkeleton() {
      return '<div aria-hidden="true">' +
          '<header class="un-navbar un-safe-top"><div class="w-full max-w-2xl mx-auto h-12 flex items-center justify-between gap-2 px-4">' +
            skBar('3.4rem', 15) + skBar('4.2rem', 15) +
          '</div></header>' + SK_NAV_SPACER +
          '<div class="pt-2 pb-4">' + skBar('7.5rem', 30) + '</div>' +
          '<div class="un-group">' + skRows(4) + '</div>' +
        '</div>' + SK_LIVE;
    }

    function listSkeleton() {
      return '<div aria-hidden="true">' +
          '<header class="un-navbar un-safe-top"><div class="w-full max-w-2xl mx-auto h-12 flex items-center justify-between gap-2 px-4">' +
            skBar('2.6rem', 15) + skBar('7rem', 17) + skBar('2.2rem', 15) +
          '</div></header>' + SK_NAV_SPACER +
          '<div class="my-3">' + skBar('100%', 40) + '</div>' +
          '<div class="un-group px-4 py-3 mb-5">' + skBar('45%', 17) + '</div>' +
          '<div class="px-4 pb-2">' + skBar('5rem', 11) + '</div>' +
          '<div class="un-group">' + skRows(5) + '</div>' +
        '</div>' + SK_LIVE;
    }

    // Screenshot-state deep link — `/?shot=pending` shows a row marked as
    // waiting to sync, a state that otherwise exists only for the moment a
    // change is in flight on a slow connection. Display-only: it forces the
    // marker on one row and writes nothing to the queue or the database.
    let shotPendingIds = null;
    async function loadShotPending() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      await loadList(lists[0].id);
      if (!current || !current.items.length) return;
      const target = current.items.find(i => !i.checked) || current.items[0];
      shotPendingIds = new Set([target.id]);
      pendingShown = true;
      repaintAllCategories();
    }

    // Screenshot-state deep link — `/?shot=search` boots straight into a list
    // with a query typed, because the clear-search button only exists mid-
    // search and screenshots/tests can only navigate, never type. Pure UI
    // state (no writes), so it works in every environment.
    async function loadShotSearch() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      pendingSearch = 'a'; // matches broadly; a no-match state still shows the bar
      loadList(lists[0].id);
    }

    // Screenshot-state deep links — `/?shot=import` and `/?shot=members` open a
    // list and then the corresponding modal, because both are tap-only and the
    // capture/test harness can only navigate. Pure UI state (no writes), so
    // they work in every environment.
    const SHOT_IMPORT_MD = [
      '# **Camping trip**',
      '',
      '* Gear',
      '  * Sleeping bag rated to -5C, plus the compression sack it shipped in and one spare dry bag',
      '  * Headlamp and spare batteries',
      '* Food',
      '  * Oatmeal packets',
      '  * ~~Trail mix~~',
      '',
    ].join('\n');

    async function loadShotModal() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      // Prefer a shared list so the members modal has a real member row.
      const target = lists.find(l => Number(l.member_count) > 0) || lists[0];
      await loadList(target.id);
      if (!current) return; // load failed (offline / gone) — nothing to open onto
      if (shotModal === 'import') return openImport('merge', SHOT_IMPORT_MD);
      // A display-only extra row with a deliberately long handle, so the shot
      // shows long usernames wrapping inside the card instead of widening it.
      // `shot: true` keeps it out of the owner's Remove affordance.
      current.members = current.members.concat(
        [{ id: -1, username: 'staging-demo-user-with-a-very-long-handle', shot: true }]
      );
      renderList(current); // keep the header's 👥 count in step with the modal
      openMembers();
      // The two invite shots are DISPLAY-ONLY fixtures: they paint a result
      // the directory would have returned instead of calling it. They have to
      // be, because the real directory has no `staging-demo-*` accounts to
      // find — so a shot that queried it would photograph an empty box. The
      // plain (non-shot) path always calls the real directory, and these work
      // in every environment. Nothing is invited and nothing is written.
      if (shotModal === 'invite') {
        const { input } = inviteEls();
        if (input) {
          input.value = SHOT_INVITE_PREFIX;
          input.focus();
          applyInviteResult(SHOT_INVITE_PREFIX, {
            usernames: SHOT_INVITE_HITS, exists: false, filtered: false,
            hasMore: true, unavailable: false,
          });
        }
      }
      if (shotModal === 'invitenone') {
        const { input } = inviteEls();
        if (input) {
          input.value = SHOT_INVITE_MISS;
          input.focus();
          applyInviteResult(SHOT_INVITE_MISS, {
            usernames: [], exists: false, filtered: false,
            hasMore: false, unavailable: false,
          });
        }
      }
    }

    // Screenshot-state deep link — `/?shot=empty` opens a list on a category
    // with no items, because the tappable "No items yet" row (issue #44) only
    // exists there. Read-only: it looks for an empty category and shows it.
    async function loadShotEmpty() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      for (const l of lists) {
        let d = null;
        try { d = await api('/api/lists/' + l.id); } catch (_) {}
        if (!d) continue;
        // The default bucket renders nothing when empty, so it doesn't count.
        const hit = d.categories.some(c =>
          !c.is_default && !d.items.some(i => i.category_id === c.id));
        if (hit) return loadList(l.id);
      }
      return loadList(lists[0].id);
    }

    // Which list a shot opens must be chosen by SHAPE, never by position.
    // seedDemoListFor writes every demo list inside one transaction, and
    // Postgres NOW() is the transaction timestamp, so they all share a
    // created_at — whichever sorts first is an accident of the tiebreaker.
    // Today that is "Demo: Due Dates", whose only category is the default
    // bucket, so a shot that needs a real category found none and rendered
    // nothing. loadShotEmpty above already picks this way; this is the same
    // scan, factored out for the two loaders that needed it.
    async function firstListWhere(lists, wanted) {
      for (const l of lists) {
        let d = null;
        try { d = await api('/api/lists/' + l.id); } catch (_) {}
        if (d && wanted(d)) return l.id;
      }
      return lists[0].id;
    }

    // True when `cat` in payload `d` has items and every one of them is ticked
    // — isCatFullyDone's question, asked of a list we haven't opened yet.
    function catDoneIn(d, cat) {
      const items = d.items.filter(i => i.category_id === cat.id);
      return items.length > 0 && items.every(i => i.checked);
    }

    // Screenshot-state deep link — `/?shot=syncbar` / `/?shot=syncdone` paint
    // Home with the offline-sync bar mid-pass and finished. A real pass is over
    // in a moment on a fast connection and skips lists already saved, so
    // neither state is reachable by navigating.
    async function loadShotSync() {
      await loadHome();
      renderSyncBar();
    }

    // Screenshot-state deep link — `/?shot=nocache` paints Home as a device
    // that has never had the app open while connected meets it offline: the
    // chrome, the plain explanation, and a strip that admits there is nothing
    // saved. Reachable no other way — it needs an empty cache AND no network.
    function loadShotNocache() {
      connState = 'offline';
      showingSaved = false;
      renderHome([], { notice: offlineHomeNotice() });
      lastScreen = 'home';
    }

    // Screenshot-state deep link — `/?shot=collapsed` opens a list with its
    // first real category collapsed. Collapsing takes a tap, and the capture
    // harness can only navigate. Pure UI state: it flips the same local
    // preference the chevron does and writes nothing to the database.
    async function loadShotCollapsed() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      await loadList(await firstListWhere(lists, d => d.categories.some(
        c => !c.is_default && d.items.some(i => i.category_id === c.id))));
      if (!current) return;
      // Prefer a category with items and none of them ticked — the case the
      // old chevron couldn't do anything with, and the point of the change.
      const cats = current.categories.filter(c => !c.is_default);
      const withItems = cats.filter(c => current.items.some(i => i.category_id === c.id));
      const target = withItems.find(c => !current.items.some(i => i.category_id === c.id && i.checked))
                  || withItems[0] || cats[0];
      if (!target) return;
      setCatCollapsed(target.id, true);
      repaintAllCategories();
    }

    // Screenshot-state deep link — `/?shot=drop` opens a list with a FINISHED
    // category expanded, which is where issue #51's drop lane shows. Finished
    // categories start shut, so this takes a tap the capture harness can't do.
    // Pure UI state: it writes nothing to the database.
    async function loadShotDrop() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      await loadList(await firstListWhere(lists, d => d.categories.some(
        c => !c.is_default && catDoneIn(d, c))));
      if (!current) return;
      const target = current.categories.find(c => !c.is_default && isCatFullyDone(c.id));
      if (!target) return;
      setCatCollapsed(target.id, false);
      repaintAllCategories();
    }

    // Screenshot-state deep link — `/?shot=diag` opens the Offline & storage
    // read-out, which lives two taps deep behind the ☰ menu. Read-only.
    async function loadShotDiag() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) { await loadHome(); }
      else { await loadList(lists[0].id); }
      openDiagnostics();
    }

    // Screenshot-state deep link — `/?shot=menu` opens a list with the ☰ menu
    // dropped down, where the two completed-items rows live. It is opened
    // directly rather than through toggleDrawer so the shot is the same on a
    // touch device, where the menu is a bottom sheet.
    async function loadShotMenu() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      await loadList(lists[0].id);
      const d = document.getElementById('drawer');
      if (d) d.classList.remove('hidden');
    }

    // Screenshot-state deep link — `/?shot=undo` opens a list with the undo
    // button live, which otherwise takes a mutation to reach. The entry it
    // stages describes a change already on screen, so nothing is written.
    async function loadShotUndo() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      await loadList(lists[0].id);
      if (!current || !current.items.length) return;
      const item = current.items[0];
      undoStack = [{ kind: 'toggle', itemId: item.id,
                     before: { checked: !!item.checked }, after: { checked: !item.checked } }];
      redoStack = [];
      syncUndoChrome();
    }

    // Screenshot-state deep links — `/?shot=due` opens a list with due dates
    // on (chips, "Today", the overdue row) and `/?shot=dueeditor` opens the
    // editor on top of it. Both are display-only: the switch is flipped in the
    // local copy when no dated list exists, and neither one PATCHes anything.
    async function loadShotDue() {
      let lists = [];
      try { ({ lists } = await api('/api/lists')); } catch (_) {}
      if (!lists.length) return loadHome();
      const target = lists.find(l => l.due_dates_enabled) || lists[0];
      await loadList(target.id);
      if (!current) return;
      if (!datesOn()) { current.list.due_dates_enabled = true; renderList(current); }
      if (!shotDueEditor) return;
      const item = current.items.find(i => i.due_date) || current.items[0];
      if (item) openDueEditor(item.id);
    }

    // --- Home / My Lists -------------------------------------------------------
    // Guards against a slow load painting over a newer navigation.
    let loadSeq = 0;

    async function loadHome() {
      current = null;
      clearHistory(); // undo is scoped to the open list
      resetCollapsed(); // as is the collapse state
      disconnectEvents();
      const app = document.getElementById('app');
      const type = lastScreen === 'list' ? 'pop' : 'none';
      const seq = ++loadSeq;
      // Cache-first: a screen we already have a saved copy of paints NOW and
      // reconciles in the background. The connection only ever affects how
      // fresh the screen is, never how long it takes to appear.
      const cached = cacheGet(HOME_KEY);
      showingSaved = !!cached;
      if (cached) {
        renderScreen(() => renderHome(cached), type);
        lastScreen = 'home';
      } else if (type === 'none') {
        app.innerHTML = homeSkeleton();
      }
      let lists;
      try {
        ({ lists } = await api('/api/lists', { timeoutMs: LOAD_TIMEOUT_MS }));
        lists = await maybeImportLandingList(lists);
        // Was `cacheSet`, whose false return nobody read — so a refused write
        // left the app believing it had a saved copy it did not have. Evicting
        // and retrying is what the queue already does for the same reason.
        homeSaveFailed = !cacheSetOrEvict(HOME_KEY, lists);
        showingSaved = false;
        // Not awaited: Home is already on screen and this is background work.
        prefetchLists(lists);
      } catch (e) {
        if (seq !== loadSeq || current) return;
        // The saved copy is already on screen; the status strip explains why it
        // may be stale, so don't replace it with an error.
        if (cached) return;
        // Chrome either way — see renderHome's `notice`. Offline is not an
        // error here, so it gets the plain explanation and a way to retry.
        renderHome([], { notice: e.network
          ? offlineHomeNotice()
          : '<p class="text-red-500 text-sm py-8 text-center">' + esc(e.message) + '</p>' });
        lastScreen = 'home';
        return;
      }
      if (seq !== loadSeq || current) return; // navigated away mid-fetch
      // Identical to what's already painted: leave the DOM (and the scroll
      // position) alone.
      if (cached && JSON.stringify(cached) === JSON.stringify(lists)) return;
      renderScreen(() => renderHome(lists), cached ? 'none' : type);
      lastScreen = 'home';
    }

    // Best-effort landing-page hand-off: the public landing page stashes its
    // demo list under this key when the visitor taps "Create your account".
    // If this browser shares storage with the platform iframe, a brand-new
    // account's first Home load turns it into their first real list.
    async function maybeImportLandingList(lists) {
      const raw = rawGet('todo:landing-list');
      if (!raw || lists.length) return lists;
      let payload = null;
      try { payload = JSON.parse(raw); } catch (_) {}
      if (!payload || !Array.isArray(payload.categories) || !payload.categories.length) {
        rawRemove('todo:landing-list');
        return lists;
      }
      try {
        await api('/api/lists/import', {
          method: 'POST',
          body: JSON.stringify({ name: payload.name || 'Welcome', categories: payload.categories }),
        });
        rawRemove('todo:landing-list');
        return (await api('/api/lists')).lists;
      } catch (_) { return lists; } // keep the key; retried on a later load
    }

    function homeBadge(l) {
      if (!l.is_owner) return '<span class="shrink-0 text-[11px] uppercase tracking-wide px-1.5 py-0.5 rounded" style="color: var(--label2); background: var(--fill)">Shared</span>';
      if (Number(l.member_count) === 0) {
        return '<span title="Private — only you can see this list" class="shrink-0 inline-flex items-center gap-1 text-[11px] uppercase tracking-wide px-1.5 py-0.5 rounded" style="color: var(--label2); background: var(--fill)">' + lockSvg(10) + 'Private</span>';
      }
      return '<span class="shrink-0 text-[11px] uppercase tracking-wide tinted px-1.5 py-0.5 rounded" style="background: var(--fill)">Owner</span>';
    }

    // Recent shared-list activity by someone else — the passive re-engagement
    // hint ("@sam checked "Dish soap"") under the counts line.
    function activityLine(l) {
      const a = l.activity;
      if (!a || !a.actor) return '';
      const t = a.text.length > 44 ? a.text.slice(0, 43) + '…' : a.text;
      return `<div class="text-[13px] mt-0.5 truncate tinted">@${esc(a.actor)} ${a.verb === 'added' ? 'added' : 'checked'} “${esc(t)}”</div>`;
    }

    // `notice` replaces the list body while keeping the chrome. An offline
    // boot with nothing saved used to replace the WHOLE screen with a red
    // error line — no nav bar, no title, nothing to tap — which is the one
    // moment the app most needs to look like an app rather than a failure.
    function renderHome(lists, opts) {
      const notice = opts && opts.notice;
      const app = document.getElementById('app');
      app.innerHTML = `
        <header id="home-bar" class="un-navbar un-safe-top">
          <!-- w-full matters: .un-navbar is itself a flex container, so
               without it this max-w wrapper shrinks to content width. -->
          <div class="w-full max-w-2xl mx-auto h-12 flex items-center justify-between gap-2 px-4 relative">
            <span class="un-navbar-title absolute left-1/2 -translate-x-1/2">My Lists</span>
            <button onclick="cycleTheme()" id="home-theme" title="Toggle theme (system / light / dark)"
                    class="tinted text-[15px] py-2 pr-2">${themeLabel()}</button>
            <div class="flex items-center gap-3">
              <button onclick="openImport('new')" class="needs-net tinted text-[15px] py-2 px-1">Import</button>
              <button onclick="newList(this)" title="New list" aria-label="New list" class="needs-net tinted text-[26px] font-light leading-none pl-1 py-1">+</button>
            </div>
          </div>
        </header>
        <div style="height: calc(3rem + env(safe-area-inset-top))"></div>
        <h1 id="home-large-title" class="un-navbar-large pt-2 pb-4">My Lists</h1>
        ${notice ? notice : lists.length ? '<div class="un-group">' + lists.map(l => `
          <a href="#/list/${l.id}" class="un-group-row un-pressable block px-4 py-3 hover:bg-[var(--fill)]">
            <div class="flex items-center gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-[16px] truncate">${esc(l.name)}</span>
                  ${homeBadge(l)}
                </div>
                <div class="text-[13px] mt-0.5" style="color: var(--label2)">
                  ${l.open_count} open · ${l.done_count} done
                  ${!l.is_owner ? ' · by @' + esc(l.owner_username) : (Number(l.member_count) ? ' · ' + memberLabel(Number(l.member_count) + 1) : '')}
                </div>
                ${activityLine(l)}
              </div>
              <span class="text-[20px] leading-none font-semibold shrink-0" style="color: var(--label3)">›</span>
            </div>
          </a>`).join('') + '</div>'
        : `<div class="text-center py-16" style="color: var(--label2)">
             <p class="mb-3">No lists yet.</p>
             <button onclick="newList(this)" class="needs-net tinted text-[15px] font-medium">Create your first list</button>
           </div>`}
      `;
      wireNative();
      // The chrome just appeared (or didn't) — re-anchor the strip to match.
      renderStrip();
      renderSyncBar();
    }

    // What Home says when this device has never held a copy of it. Deliberately
    // not an error: nothing has gone wrong, the app simply has not been open
    // while connected yet, and saying so is more use than the exception text.
    function offlineHomeNotice() {
      return `<div class="text-center py-16" style="color: var(--label2)">
                <p class="text-[15px]">Your lists aren't saved on this device yet.</p>
                <p class="text-[13px] mt-1" style="color: var(--label3)">
                  Open Todo List once while connected and they'll be here next
                  time, even with no signal.</p>
                <button onclick="loadHome()" class="tinted text-[15px] font-medium mt-4">Try again</button>
              </div>`;
    }

    // --- saving every list for offline ---------------------------------------
    // Opening a list used to be the only thing that saved it. So offline, Home
    // painted from its saved copy and every row on it led to "This list isn't
    // available offline" — the shape of an app that looks ready and isn't.
    // Home now pulls each list in the background once it has loaded, so what
    // is on screen is actually openable.
    //
    // Deliberately modest. One request at a time, so a phone on a slow link is
    // never flooded; skipped entirely while offline; abandoned the moment a
    // newer Home load starts; and it NEVER evicts — a list saved in the
    // background must not push out one the user actually opened, so a full
    // store stops the pass and says so instead. MAX_CACHED_LISTS is what keeps
    // a large account from filling the device, and lists past it are reported
    // rather than silently dropped.
    let syncState = null;   // { done, total, skipped, failed } while a pass runs
    let syncSeq = 0;
    let syncHideTimer = null;

    // How old a saved copy may be before the pass re-reads it, and how many
    // aged-out copies one pass will re-read. The age fallback only exists to
    // catch edits the counts CANNOT see (an item's text corrected, a reorder,
    // a due date moved, a category renamed), so it is deliberately slow and
    // deliberately capped: a device that has been away for a week refreshes a
    // few lists per visit to Home rather than all ten at once.
    const SAVED_COPY_MAX_AGE_MS = 6 * 60 * 60 * 1000;
    const MAX_AGED_REFRESHES_PER_PASS = 3;

    // What Home already knows about a list, in the shape the saved copy can
    // be asked for. Home's payload carries the name, the due-dates flag and
    // both counts for every list, so most staleness is detectable with no
    // request at all — and, just as importantly, NO request is made when
    // nothing has changed.
    //
    // Blind to edits that leave the counts alone; that is what the age
    // fallback above is for.
    function homeFingerprint(row) {
      return [
        String(row.name == null ? '' : row.name),
        row.due_dates_enabled ? 1 : 0,
        Number(row.open_count) || 0,
        Number(row.done_count) || 0,
      ].join('\u0000');
    }
    function savedFingerprint(saved) {
      const list = (saved && saved.list) || {};
      const items = (saved && Array.isArray(saved.items)) ? saved.items : [];
      let open = 0, done = 0;
      for (const i of items) { if (i && i.checked) done++; else open++; }
      return [
        String(list.name == null ? '' : list.name),
        list.due_dates_enabled ? 1 : 0,
        open,
        done,
      ].join('\u0000');
    }

    async function prefetchLists(lists) {
      const mySeq = ++syncSeq;
      clearTimeout(syncHideTimer);
      syncState = null;
      if (shotSync) { renderSyncBar(); return; }   // display-only shot owns the bar
      if (!DURABLE || !isOnline() || !Array.isArray(lists)) { renderSyncBar(); return; }
      const targets = lists.slice(0, MAX_CACHED_LISTS);
      const skipped = lists.length - targets.length;
      // What this device actually holds a copy of. The LRU and the payloads
      // are kept in step (#62), so this answers "do we have it?" without
      // parsing anything — which matters below, where the alternative would
      // be a JSON.parse of every list on Home on every single Home load.
      const held = new Set((cacheGet(LRU_KEY) || []).map(String));
      const missing = targets.filter(l => !held.has(String(l.id)));

      // A saved copy used to be written once and never read again, so a list
      // you saved and did not open went stale with no ceiling — worst on a
      // shared list, where somebody else is the one changing it. Two ways back:
      //
      //   · the counts Home already returned disagree with the copy, which
      //     means it is demonstrably out of date and costs nothing to notice;
      //   · it simply has not been read from the server for a while, which is
