      //     the only way to catch an edit the counts cannot see.
      //
      // The count check stands down while anything is queued: a copy written
      // by cacheList has the unsent changes already applied to it, so its
      // counts are SUPPOSED to differ from the server's until the queue
      // drains, and comparing them would refetch every list on every Home
      // load until it did.
      //
      // Deliberately scanned over EVERY list on Home we hold a copy of, not
      // just the top-of-Home window `targets` covers. A list can be pushed
      // out of that window by newer ones while its copy stays saved on the
      // device — and a copy we are still keeping is a copy worth keeping
      // current. Bounded by the cap either way, since `held` is the LRU.
      const stamps = savedAtMap();
      const queued = queueLength() > 0;
      const changed = [], aged = [];
      for (const l of lists) {
        if (!held.has(String(l.id))) continue;     // no copy — `missing` covers the window
        const stamp = stamps[String(l.id)] || null;
        // No stamp at all: a copy saved before this bookkeeping existed, so
        // its age and contents are both unknown. Treat it as due rather than
        // guess — the per-pass cap keeps that one-off migration gentle.
        if (!stamp) { aged.push({ l, at: 0 }); continue; }
        if (!queued && homeFingerprint(l) !== stamp.fp) { changed.push(l); continue; }
        const at = Number(stamp.at) || 0;
        if (Date.now() - at > SAVED_COPY_MAX_AGE_MS) aged.push({ l, at });
      }
      aged.sort((a, b) => a.at - b.at);            // oldest copy first
      const refreshes = changed.concat(aged.slice(0, MAX_AGED_REFRESHES_PER_PASS).map(x => x.l));

      // Missing first: having no copy of a list at all matters more than
      // having a slightly old one.
      const queue = missing.map(l => ({ l, refresh: false }))
        .concat(refreshes.map(l => ({ l, refresh: true })));
      if (!queue.length) { renderSyncBar(); return; }

      syncState = {
        done: 0, total: queue.length, skipped, failed: false,
        // A pass with nothing missing is not "saving lists for offline" — they
        // are already saved. Say what it is actually doing.
        refreshOnly: !missing.length,
      };
      renderSyncBar();
      let stoppedEarly = false, capped = false;
      for (const t of queue) {
        const l = t.l;
        if (mySeq !== syncSeq) return;            // a newer Home load owns this now
        if (!isOnline()) { stoppedEarly = true; break; }
        // Out of room for another NEW list — but a refresh occupies a slot it
        // already holds, so it still fits and should not be starved by a new
        // list that doesn't.
        if (capped && !t.refresh) continue;
        let d = null;
        try {
          d = await api('/api/lists/' + l.id, { timeoutMs: LOAD_TIMEOUT_MS });
        } catch (_) {
          // Went offline, or the list is gone. Stop quietly — the next Home
          // load picks up wherever this one got to.
          stoppedEarly = true;
          break;
        }
        if (mySeq !== syncSeq) return;
        // Reserve the slot BEFORE writing the payload. The other order wrote
        // the list and THEN asked for room, so a full LRU left the payload in
        // storage with nothing pointing at it — and every eviction path we
        // have (touchList, cacheSetOrEvict) walks the LRU, so it could never
        // be reclaimed. One new list past the cap leaked one payload, on every
        // Home load, with no ceiling.
        // (A refresh is already in the LRU, so this returns true for one.)
        if (!rememberSaved(l.id)) { capped = true; continue; }
        if (!cacheSet(listKey(l.id), d)) {
          // Give back only a slot we just took. A refresh's slot was already
          // there and still points at the OLDER payload — dropping the LRU
          // entry here would strand that payload exactly as #62 fixed.
          if (!t.refresh) forgetSaved(l.id);
          syncState.failed = true;
          break;
        }
        stampFetched(l.id, d);
        syncState.done++;
        renderSyncBar();
      }
      if (mySeq !== syncSeq) return;
      if (capped) {
        // Not a failure and not a storage problem: MAX_CACHED_LISTS lists are
        // already saved, and these are the ones that don't fit beside them.
        // Reported the same way as lists past the cap always were.
        syncState.skipped += syncState.total - syncState.done;
        syncState.total = syncState.done;
      }
      if (stoppedEarly && !syncState.failed) { syncState = null; renderSyncBar(); return; }
      renderSyncBar();
      // Let the finished state be readable, then take the bar away.
      syncHideTimer = setTimeout(() => {
        if (mySeq !== syncSeq) return;
        syncState = null;
        renderSyncBar();
      }, syncState.failed ? 4200 : 2600);
    }

    const plurLists = n => n + (n === 1 ? ' list' : ' lists');

    function syncBarState() {
      // Display-only deep links, so the bar is capturable: neither writes.
      if (shot === 'syncbar') return { text: 'Saving lists for offline… 2 of 5', pct: 20 };
      if (shot === 'syncdone') return { text: 'All lists saved for offline', ok: true, pct: 100 };
      if (shot === 'syncrefresh') return { text: 'Updating saved lists… 1 of 3', pct: 33 };
      if (shot === 'syncfresh') return { text: 'Saved lists are up to date', ok: true, pct: 100 };
      if (shot === 'synccap') {
        return { text: plurLists(3) + " won't fit — " + MAX_CACHED_LISTS + ' are already saved', ok: true, pct: 100 };
      }
      if (current) return null;   // list view; the top strip speaks there
      if (!syncState) return null;
      const { done, total, skipped, failed, refreshOnly } = syncState;
      const pct = total ? Math.round((done / total) * 100) : 0;
      if (failed) {
        return { text: 'Saved ' + plurLists(done) + ' — not enough storage for the rest', pct };
      }
      if (done >= total) {
        // Nothing was missing — every list was already saved and this pass only
        // brought copies back up to date. Claiming they were just "saved for
        // offline" would overstate what happened.
        if (refreshOnly && !skipped) return { text: 'Saved lists are up to date', ok: true, pct: 100 };
        if (!skipped) return { text: 'All lists saved for offline', ok: true, pct: 100 };
        // "Saved 0 lists for offline" reads as a failure when nothing was left
        // to do: say what is actually true, which is that the cap is full.
        return { text: done
            ? 'Saved ' + plurLists(total) + ' for offline · ' + skipped + ' more won\'t fit'
            : plurLists(skipped) + " won't fit — " + MAX_CACHED_LISTS + ' are already saved',
          ok: true, pct: 100 };
      }
      return {
        text: (refreshOnly ? 'Updating saved lists… ' : 'Saving lists for offline… ')
          + (done + 1) + ' of ' + total,
        pct,
      };
    }

    function renderSyncBar() {
      const bar = document.getElementById('sync-bar');
      if (!bar) return;
      const st = syncBarState();
      if (!st) {
        bar.classList.add('hidden');
        bar.textContent = ''; // don't leave stale text in the a11y tree
        return;
      }
      bar.innerHTML = '<div>' + esc(st.text) + '</div>'
        + '<div class="sync-track"><div class="sync-fill" style="width: ' + st.pct + '%"></div></div>';
      bar.classList.remove('hidden');
    }

    // Silent refetch for pull-to-refresh — no "Loading…" wipe.
    async function refreshHome() {
      try {
        const { lists } = await api('/api/lists', { timeoutMs: LOAD_TIMEOUT_MS });
        cacheSet(HOME_KEY, lists);
        if (current) return; // navigated into a list mid-fetch
        renderHome(lists);
      } catch (e) {
        if (!e.network) toast(e.message);
      }
    }

    async function newList(btn) {
      if (!requireOnline()) return;
      const name = await askText('List name:');
      if (!name || !name.trim()) return;
      await withBusy(btn, async () => {
        try {
          const { list } = await api('/api/lists', {
            method: 'POST', body: JSON.stringify({ name: name.trim() }), timeoutMs: MUTATION_TIMEOUT_MS,
          });
          location.hash = '#/list/' + list.id;
        } catch (e) { reportWriteError(e); }
      });
    }

    // --- List View --------------------------------------------------------------
    async function loadList(id) {
      // A freshly opened list starts unfiltered, unless the ?shot=search deep
      // link staged a query for this navigation.
      searchQuery = pendingSearch;
      pendingSearch = '';
      // Switching lists (or a first open) starts with an empty history; a plain
      // reload of the list already open keeps it. The collapse cache is
      // per-list, so it is dropped on the same condition.
      if (!current || String(current.list.id) !== String(id)) { clearHistory(); resetCollapsed(); }
      const app = document.getElementById('app');
      const type = lastScreen === 'home' ? 'push' : 'none';
      const seq = ++loadSeq;
      // Cache-first, exactly as Home: paint the saved copy immediately (with
      // any still-unsent changes projected back on), then reconcile. The live
      // stream is opened off the first paint rather than the fetch, so remote
      // changes start arriving while the refetch is still in the air.
      const cached = cacheGet(listKey(id));
      let painted = false;
      showingSaved = !!cached;
      if (cached) {
        current = applyPendingOps(cached);
        touchList(id);
        renderScreen(() => renderList(current), type);
        lastScreen = 'list';
        connectEvents(current.list.id);
        painted = true;
      } else if (type === 'none') {
        app.innerHTML = listSkeleton();
      }
      let data;
      try {
        data = await api('/api/lists/' + id, { timeoutMs: LOAD_TIMEOUT_MS });
      } catch (e) {
        if (seq !== loadSeq) return;
        if (painted) return; // saved copy stands; the strip explains the rest
        disconnectEvents();
        showingSaved = false; // nothing of this list is on screen
        // A list never opened while connected has nothing to show — say that
        // plainly instead of showing a red error.
        app.innerHTML = e.network
          ? `<div class="py-10 text-center">
               <p class="text-[15px]" style="color: var(--label2)">This list isn't available offline.</p>
               <p class="text-[13px] mt-1" style="color: var(--label3)">Open it once while connected and it'll be here next time.</p>
               <p class="mt-4"><a href="#/" class="tinted text-sm">‹ Back to My Lists</a></p>
             </div>`
          : `<p class="text-red-500 text-sm py-8 text-center">${esc(e.message)}</p>
             <p class="text-center"><a href="#/" class="tinted text-sm">‹ Back to My Lists</a></p>`;
        renderStrip(); // this screen has no nav bar for the strip to hang under
        lastScreen = 'list';
        return;
      }
      if (seq !== loadSeq) return; // navigated away mid-fetch
      showingSaved = false; // this is live data now, not the saved copy
      const before = painted ? JSON.stringify(current) : null;
      current = applyPendingOps(data);
      cacheList();
      stampFetched(id, data); // `data`, not `current`: what the SERVER said
      if (painted && before === JSON.stringify(current)) return; // nothing changed
      renderScreen(() => renderList(current), painted ? 'none' : type);
      lastScreen = 'list';
      connectEvents(current.list.id);
    }

    // Silent refetch + single repaint — no "Loading…" wipe, so no flash.
    // Used for both error recovery and SSE-pushed remote changes, so it
    // preserves any in-progress typing in an add-item / new-category field
    // across the repaint.
    // Single-flight: a live update, a pull-to-refresh and a finished drain can
    // all want a refetch at once, and on a slow link three in-flight copies of
    // the same GET make each other slower. A request that arrives mid-flight is
    // remembered and run once, after.
    let refreshInFlight = false, refreshQueued = false;
    async function refreshList() {
      if (!current) return;
      if (refreshInFlight) { refreshQueued = true; return; }
      refreshInFlight = true;
      const id = current.list.id;
      try {
        const fresh = await api('/api/lists/' + id, { timeoutMs: LOAD_TIMEOUT_MS });
        const data = applyPendingOps(fresh);
        if (!current || current.list.id !== id) return; // navigated away mid-fetch
        current = data;
        cacheList();
        stampFetched(id, fresh); // the raw response, for the same reason
        const ae = document.activeElement;
        let focus = null;
        if (ae && ae.tagName === 'INPUT') {
          if (ae.id === 'search-input') {
            focus = { sel: '#search-input', value: ae.value, pos: ae.selectionStart };
          } else if (ae.name === 'text' && ae.closest('#quick-add-form')) {
            focus = { sel: '#quick-add-form input[name=text]', value: ae.value, pos: ae.selectionStart };
          } else if (ae.name === 'text' && ae.closest('.cat-section')) {
            focus = { sel: '#cat-' + ae.closest('.cat-section').dataset.cat + ' input[name=text]', value: ae.value, pos: ae.selectionStart };
          } else if (ae.name === 'name') {
            focus = { sel: 'input[name=name]', value: ae.value, pos: ae.selectionStart };
          }
        }
        renderList(current);
        if (focus) {
          const input = document.querySelector(focus.sel);
          if (input) {
            input.value = focus.value;
            input.focus({ preventScroll: true });
            try { input.setSelectionRange(focus.pos, focus.pos); } catch (_) {}
          }
        }
      } catch (e) {
        if (!e.network) toast(e.message);
      } finally {
        refreshInFlight = false;
        if (refreshQueued) { refreshQueued = false; setTimeout(refreshList, 0); }
      }
    }

    // Items of one section (unchecked or checked) of a category, in order.
    // With due dates on, the order is chronological instead of manual: soonest
    // first, undated last, ties falling back to the manual order. Sorted here on
    // the client rather than in SQL so it holds for a cached list, an offline
    // edit and a still-queued add exactly as it does for a fresh fetch.
    function sectionItems(catId, checked) {
      const rows = current.items.filter(i => i.category_id === catId && !!i.checked === checked);
      const manual = (a, b) => (a.sort_order - b.sort_order) || (a.id - b.id);
      if (!datesOn()) return rows.sort(manual);
      return rows.sort((a, b) => {
        const ad = a.due_date || '', bd = b.due_date || '';
        if (ad !== bd) {
          if (!ad) return 1;   // undated sinks below everything with a date
          if (!bd) return -1;
          return ad < bd ? -1 : 1;
        }
        // Same day: a timed item comes before an all-day one.
        const at = a.due_time || '', bt = b.due_time || '';
        if (ad && at !== bt) {
          if (!at) return 1;
          if (!bt) return -1;
          return at < bt ? -1 : 1;
        }
        return manual(a, b);
      });
    }

    // --- due dates (issue #38) --------------------------------------------------
    // Off by default and per list: a list only grows dates when its owner asks
    // for them, and every other list stays exactly as it was. Values are
    // wall-clock (YYYY-MM-DD + HH:MM strings end to end, never Date instants),
    // so "the 3rd at 9am" reads back the same in every timezone.
    const datesOn = () => !!(current && current.list && current.list.due_dates_enabled);
    const LOCALE = (jwt && jwt.locale) || undefined;

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
             '-' + String(d.getDate()).padStart(2, '0');
    }
    function nowHM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function parseISODate(s) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }
    function fmtDueTime(t) {
      const m = /^(\d{1,2}):(\d{2})/.exec(t || '');
      if (!m) return '';
      try {
        return new Date(2000, 0, 1, +m[1], +m[2])
          .toLocaleTimeString(LOCALE, { hour: 'numeric', minute: '2-digit' });
      } catch (_) { return t; }
    }

    // Short, human label for the chip: the nearby days get names, the rest get
    // a date. Deliberately never "in 3 days" — a weekday is easier to act on.
    function dueLabel(i) {
      const d = parseISODate(i.due_date);
      if (!d) return '';
      const t = parseISODate(todayISO());
      const diff = Math.round((d - t) / 86400000);
      let day;
      if (diff === 0) day = 'Today';
      else if (diff === 1) day = 'Tomorrow';
      else if (diff === -1) day = 'Yesterday';
      else if (diff > 1 && diff < 7) day = d.toLocaleDateString(LOCALE, { weekday: 'short' });
      else {
        const opts = { month: 'short', day: 'numeric' };
        if (d.getFullYear() !== t.getFullYear()) opts.year = 'numeric';
        day = d.toLocaleDateString(LOCALE, opts);
      }
      return day + (i.due_time ? ' · ' + fmtDueTime(i.due_time) : '');
    }

    // Overdue is a fact worth colouring, not a scolding: a ticked item is never
    // overdue, and an all-day item is due all day (not at 00:00).
    function isOverdue(i) {
      if (!i.due_date || i.checked) return false;
      const today = todayISO();
      if (i.due_date < today) return true;
      if (i.due_date > today) return false;
      return !!i.due_time && i.due_time < nowHM();
    }

    // Applies a due date/time change: local first, queued for the server, and
    // recorded for undo — the same shape as every other item mutation, so it
    // works offline too. Passing a null date clears the time with it.
    function applyDue(id, date, time) {
      const idx = current.items.findIndex(i => i.id === id);
      if (idx === -1) return false;
      const it = current.items[idx];
      const before = { due_date: it.due_date || null, due_time: it.due_time || null };
      const after = { due_date: date || null, due_time: date ? (time || null) : null };
      if (before.due_date === after.due_date && before.due_time === after.due_time) return true;
      if (!commit({ type: 'due', itemId: id, method: 'PATCH',
                    path: '/api/items/' + id, body: after, undo: before })) return false;
      current.items[idx] = { ...it, ...after };
      record({ kind: 'due', itemId: id, before, after });
      cacheList();
      repaintCategory(it.category_id);
      return true;
    }

    // The issue asked for a time field under every item; a row is the wrong
    // place for one — rows are destroyed and rebuilt by every repaint, and at
    // 390px there is no room beside the text. So the row carries a chip and the
    // chip opens this editor, which uses the platform's own date/time pickers
    // (the kit deliberately leaves those inputs alone).
    let dueModal = null;
    function openDueEditor(id) {
      const item = current && current.items.find(i => i.id === id);
      if (!item) return;
      if (!window.unNative) { toast('The due-date editor needs the UI kit, which failed to load'); return; }
      if (dueModal) dueModal.dismiss();
      const el = document.createElement('div');
      el.id = 'due-editor';
      el.className = 'flex flex-col gap-3';
      el.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <h2 class="font-semibold text-lg">Due date</h2>
          <button onclick="closeDueEditor()" class="x-close text-xl leading-none px-1 shrink-0">&times;</button>
        </div>
        <p class="text-[13px] break-words" style="color: var(--label2)">${esc(item.text)}</p>
        <label class="flex items-center justify-between gap-3 text-[15px]">
          <span>Date</span>
          <input id="due-date-input" type="date" value="${esc(item.due_date || '')}"
                 class="rounded-lg px-2.5 py-2 text-[15px] focus:outline-none"
                 style="background: var(--fill); color: var(--label); border: 1px solid var(--separator)">
        </label>
        <label class="flex items-center justify-between gap-3 text-[15px]">
          <span>Time <span style="color: var(--label3)">(optional)</span></span>
          <input id="due-time-input" type="time" value="${esc(item.due_time || '')}"
                 class="rounded-lg px-2.5 py-2 text-[15px] focus:outline-none"
                 style="background: var(--fill); color: var(--label); border: 1px solid var(--separator)">
        </label>
        <div class="flex flex-wrap justify-end gap-2 pt-1">
          ${item.due_date ? `<button onclick="clearDue(${id})" class="text-sm px-3 py-1.5 rounded-lg ${BTN_SOFT}">Clear</button>` : ''}
          <button onclick="saveDue(${id})" class="text-sm px-3 py-1.5 rounded-lg btn-primary">Save</button>
        </div>
      `;
      const handle = presentAppModal(el, {
        onDismiss: () => { if (dueModal === handle) dueModal = null; },
      });
      dueModal = handle;
    }
    function closeDueEditor() {
      if (dueModal) dueModal.dismiss();
    }
    function saveDue(id) {
      const date = (document.getElementById('due-date-input') || {}).value || '';
      const time = (document.getElementById('due-time-input') || {}).value || '';
      if (!date && time) { toast('Pick a date first — a time on its own has nothing to be due on'); return; }
      applyDue(id, date || null, time ? time.slice(0, 5) : null);
      closeDueEditor();
    }
    function clearDue(id) {
      applyDue(id, null, null);
      closeDueEditor();
    }

    // Owner-only, and only ever explicit: flipping this off leaves the dates on
    // disk, so turning it back on restores them rather than destroying them.
    async function setDueDates(v) {
      if (!current) return;
      if (!isOnline()) { requireOnline(); syncDueSwitch(); return; }
      const prev = !!current.list.due_dates_enabled;
      current.list.due_dates_enabled = !!v;
      cacheList();
      renderList(current); // sorting, chips and drag availability all change
      closeDrawer();
      try {
        await api('/api/lists/' + current.list.id, {
          method: 'PATCH', body: JSON.stringify({ due_dates_enabled: !!v }),
          timeoutMs: MUTATION_TIMEOUT_MS,
        });
        toast(v ? 'Due dates on — this list now sorts by date' : 'Due dates off');
      } catch (e) {
        current.list.due_dates_enabled = prev;
        cacheList();
        renderList(current);
        reportWriteError(e);
      }
    }
    function syncDueSwitch() {
      document.querySelectorAll('.due-switch').forEach(sw => { sw.checked = datesOn(); });
    }

    // The row handle stays visible in a dated list — as an explanation rather
    // than a dead control, since the reason it doesn't drag isn't obvious.
    function dateSortHint() {
      toast('This list is sorted by due date — turn due dates off to reorder by hand');
    }

    // Display order is the manual drag order (current.categories) — static —
    // except the default (uncategorized) bucket, which is always pinned first.
    function displayCategories() {
      return [...current.categories].sort((a, b) =>
        ((b.is_default ? 1 : 0) - (a.is_default ? 1 : 0)) ||
        (a.sort_order - b.sort_order) || (a.id - b.id));
    }

    // #cats body: all categories, or a single "no matches" note when an
    // active search filters every one of them out.
    function renderCats() {
      const html = displayCategories().map(c => renderCategory(c)).join('');
      if (!html && searchActive()) {
        return `<p class="text-sm py-8 text-center" style="color: var(--label2)">No items match "${esc(searchQuery.trim())}"</p>`;
      }
      return html;
    }

    // Menu items shared by the desktop dropdown and the touch bottom sheet.
    function drawerItemsHtml(isOwner, sheet) {
      const c = sheet ? 'sheet-row un-pressable' : DRAWER_ITEM;
      return `
        <!-- Completed items: two plain actions, a row each, indistinguishable
             from the actions below them (issue #68). Both write the same
             stored preference the old switch did, and neither carries a
             selected state — they read as things you do, not a setting whose
             position you have to interpret. -->
        <button type="button" data-done-row="show" class="${c}"
                onclick="setShowCompleted(true)">Show all completed</button>
        <button type="button" data-done-row="hide" class="${c}"
                onclick="setShowCompleted(false)">Hide all completed</button>
        ${isOwner && current ? `
        <!-- Off by default, per list, owner-only (issue #38). The class rather
             than an id: this markup renders twice (dropdown + bottom sheet). -->
        <label class="${c} cursor-pointer">
          <span>Include due dates</span>
          <input type="checkbox" class="un-switch due-switch" ${datesOn() ? 'checked' : ''} onchange="setDueDates(this.checked)">
        </label>` : ''}
        <button onclick="closeDrawer(); openDiagnostics()" class="${c}">Offline &amp; storage</button>
        <button onclick="closeDrawer(); openExport()" class="${c}">Export markdown</button>
        <button onclick="closeDrawer(); openImport('merge')" class="needs-net ${c}">Import markdown</button>
        <button onclick="cycleTheme()" data-theme-label class="${c}">Theme: ${themeLabel()}</button>
        ${isOwner ? `<button onclick="closeDrawer(); deleteList(this)" class="needs-net ${c}" style="color: var(--danger)">Delete list</button>` : ''}
      `;
    }

    function renderList(d) {
      const isOwner = d.role === 'owner';
      const app = document.getElementById('app');
      app.innerHTML = `
        <header id="list-bar" class="un-navbar un-safe-top">
          <div class="w-full max-w-2xl mx-auto h-12 flex items-center justify-between gap-1 px-2 relative">
            <a href="#/" title="Back to My Lists" class="un-navbar-back flex items-center text-[17px] pl-1.5 pr-2 py-1.5 shrink-0">Lists</a>
            <h1 id="list-title" class="un-navbar-title absolute left-1/2 -translate-x-1/2 max-w-[28%] truncate text-center${isOwner ? ' cursor-pointer' : ''}"
                ${isOwner ? 'onclick="renameList(this)" title="Rename list"' : ''}>${esc(d.list.name)}</h1>
            <div class="flex items-center shrink-0">
              <!-- Undo / redo. Always present so the affordance is discoverable,
                   dimmed and disabled while the matching stack is empty
                   (syncUndoChrome keeps them honest between repaints). -->
              <button id="undo-btn" onclick="doUndo()" title="Undo (⌘Z)" aria-label="Undo"
                      class="tinted px-1 py-2.5" style="opacity: .3" aria-disabled="true" disabled>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
              </button>
              <button id="redo-btn" onclick="doRedo()" title="Redo (⇧⌘Z)" aria-label="Redo"
                      class="tinted px-1 py-2.5" style="opacity: .3" aria-disabled="true" disabled>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
              </button>
              ${d.members.length === 0 ? `
              <button onclick="openMembers()" title="Private — only you can see this list. Tap to invite." aria-label="Private — only you can see this list. Tap to invite."
                      class="needs-net tinted px-2.5 py-2.5">${lockSvg(16)}</button>` : `
              <button onclick="openMembers()" title="Members" class="needs-net tinted text-[15px] px-2 py-2">👥 ${1 + d.members.length}</button>`}
              <div id="drawer-wrap" class="relative shrink-0">
                <button onclick="toggleDrawer(event)" title="Menu" aria-label="Menu" class="tinted px-2.5 py-2.5">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="block"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                </button>
                <div id="drawer" class="hidden absolute right-0 top-full mt-1 w-64 rounded-xl surface shadow-2xl z-30 py-1 overflow-hidden" style="border: 1px solid var(--separator)">
                  ${drawerItemsHtml(isOwner, false)}
                </div>
              </div>
            </div>
          </div>
        </header>
        <div style="height: calc(3rem + env(safe-area-inset-top))"></div>

        <div class="relative my-3">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--label2)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="text" autocomplete="off" enterkeyhint="search" placeholder="Search items…"
                 value="${esc(searchQuery)}"
                 oninput="onSearchInput(this.value)"
                 onkeydown="if (event.key === 'Escape') clearSearch()"
                 class="w-full rounded-[10px] pl-9 pr-12 py-2.5 text-[15px] focus:outline-none"
                 style="background: var(--fill); color: var(--label)">
          <!-- Clear-search control. The absolute positioning lives on the
               wrapper, not the button, so the kit's .un-touch-target (which
               needs position:relative) can't fight it: the button stays a
               plain 34px circle in normal flow with a ≥44px invisible hit
               area centered on it. -->
          <div class="absolute right-1.5 top-1/2 -translate-y-1/2">
            <button id="search-clear" onclick="clearSearch()" title="Clear search" aria-label="Clear search"
                    class="${searchQuery ? '' : 'hidden '}un-touch-target un-pressable flex items-center justify-center w-[34px] h-[34px] rounded-full"
                    style="background: var(--fill2); color: var(--label2)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="block"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>

        <form id="quick-add-form" onsubmit="return quickAdd(event)"
              class="${searchActive() ? 'hidden ' : ''}un-group flex items-center gap-2.5 px-4 py-2.5 mb-5">
          <span class="tinted text-[20px] leading-none select-none font-light">+</span>
          <input name="text" placeholder="Add an item…" autocomplete="off" enterkeyhint="done"
                 onblur="commitOnBlur(event)"
                 class="flex-1 bg-transparent text-[16px] focus:outline-none py-0.5" style="color: var(--label)">
        </form>

        <div id="cats">
          ${renderCats()}
        </div>

        <form id="new-cat-form" onsubmit="return addCategory(event)" class="needs-net ${searchActive() ? 'hidden ' : ''}mt-7 flex items-center gap-2 px-4">
          <span class="tinted text-[18px] leading-none select-none">+</span>
          <input name="name" placeholder="New category…" autocomplete="off" enterkeyhint="done"
                 onblur="commitOnBlur(event)"
                 class="flex-1 bg-transparent text-[15px] focus:outline-none py-1.5" style="color: var(--label)">
        </form>
      `;
      wireNative();
      // The chrome just changed — keep the strip's anchor in step (renderHome
      // does the same). Cheap: a class toggle and a text write.
      renderStrip();
      renderSyncBar();   // Home's bar; it goes away in the list view
      syncUndoChrome();
    }

    // --- ☰ menu: anchored dropdown on desktop, kit bottom sheet on touch --------
    function toggleDrawer(ev) {
      ev.stopPropagation();
      if (IS_TOUCH && window.unNative) return openMenuSheet();
      const d = document.getElementById('drawer');
      if (d) d.classList.toggle('hidden');
    }
    function closeDrawer() {
      const d = document.getElementById('drawer');
      if (d) d.classList.add('hidden');
      closeMenuSheet();
    }
    document.addEventListener('click', e => {
      const d = document.getElementById('drawer');
      if (d && !d.classList.contains('hidden') && !e.target.closest('#drawer-wrap')) closeDrawer();
    });

    let menuSheetHandle = null;
    function openMenuSheet() {
      const el = document.createElement('div');
      el.className = 'pb-1';
      el.innerHTML = drawerItemsHtml(!!current && current.role === 'owner', true);
      menuSheetHandle = unNative.presentSheet({
        contentEl: el,
        onDismiss: () => { menuSheetHandle = null; },
      });
    }
    function closeMenuSheet() {
      if (menuSheetHandle) menuSheetHandle.dismiss();
    }

    function renderCategory(c) {
      // Active search: a matching category name shows all its items; otherwise
      // both sections filter to matching item text, and a category with no
      // matches disappears. Matching done items always render (bypassing
      // catShowDone) without touching catDoneOverrides, so clearing the search
      // restores the collapse state exactly.
      const searching = searchActive();
      const q = searchQ();
      // The default category is the invisible "uncategorized" bucket: no
      // header (no name, drag handle, rename or delete), pinned first, and
      // rendered only when it has items. Its name never matches a search.
      const isBucket = !!c.is_default;
      const catMatches = searching && !isBucket && c.name.toLowerCase().includes(q);
      let unchecked = sectionItems(c.id, false);
      let checked = sectionItems(c.id, true);
      if (searching && !catMatches) {
        unchecked = unchecked.filter(i => i.text.toLowerCase().includes(q));
        checked = checked.filter(i => i.text.toLowerCase().includes(q));
        if (!unchecked.length && !checked.length) return '';
      }
      const showDone = searching ? checked.length > 0 : catShowDone(c.id);
      const empty = !unchecked.length && !checked.length;
      if (isBucket && empty) return ''; // an empty bucket renders nothing
      const fullyDone = !unchecked.length && checked.length > 0;
      // The active area always keeps a lane, even when everything in the
      // category is ticked off — that lane is what a dragged row lands on
      // (issue #51). Without it a finished category renders its active area
      // `hidden` and offers the reorder kit nothing to hit, so a category
      // holding a single done item — its whole card being that one item —
      // couldn't be dragged into at all. Mid-search it stays out of the way:
      // the filter, not the category, decides what is on screen there, and
      // reorder is off anyway.
      const activeLane = !unchecked.length && (empty || !searching);
      // Whole-category collapse. The invisible bucket has no header, so it has
      // nothing to collapse from; a search owns visibility outright.
      const collapsed = !isBucket && !searching && catCollapsed(c.id);
      const total = unchecked.length + checked.length;
      // What the header says about what's hidden. A finished category counts
      // its done items (that IS everything); otherwise it counts the lot.
      const collapsedCount = fullyDone
        ? checked.length + ' done'
        : total + ' item' + (total === 1 ? '' : 's');
      // Top margin lives on the section (not a space-y on #cats) so a
      // repaintCategory outerHTML swap keeps it correct when the category's
      // completion state changes in place.
      const idx = displayCategories().findIndex(x => x.id === c.id);
      const topGap = idx > 0 ? (fullyDone ? ' mt-4' : ' mt-6') : '';
      return `
        <section id="cat-${c.id}" data-cat="${c.id}" class="cat-section${topGap}">
          ${isBucket ? '' : `
          <div class="cat-head flex items-center gap-1.5 px-2 py-1 mb-1.5">
            ${searching ? '' : `
            <span class="drag-handle cat-drag select-none" style="color: var(--label3)" title="Drag to reorder categories">⠿</span>`}
            <!-- Chevron + name are ONE control: the collapse toggle. Keeping
                 them in a single button makes the target ≥44px, gives the
                 state one honest aria-expanded, and — because the chevron is a
                 rotated glyph rather than a swapped ▶/▼ pair — means the row
                 can't shift vertically when it toggles (issue #48). -->
            <button type="button" class="cat-toggle flex-1 min-w-0 flex items-center gap-1.5"
                    ${searching ? '' : `onclick="toggleCatCollapsed(${c.id})"`}
                    aria-expanded="${collapsed ? 'false' : 'true'}"
                    title="${searching ? '' : (collapsed ? 'Expand' : 'Collapse') + ' this category'}">
              ${searching ? '' : `<span class="chev select-none" aria-hidden="true" style="color: var(--label2)">›</span>`}
              <h2 class="un-group-header flex-1 truncate text-left">${esc(c.name)}</h2>
            </button>
            ${collapsed ? `
            <span class="cat-count select-none text-[13px] px-1 shrink-0" style="color: var(--label3)">${collapsedCount}</span>` : ''}
            ${searching || collapsed ? '' : `
            <button onclick="toggleAdder(${c.id})" title="Add an item"
                    class="tinted text-[20px] px-1.5 leading-none font-light">+</button>`}
            <!-- Rename lost its home when the title became the collapse
                 control, so it gets an explicit one. Hover-revealed on desktop;
                 hidden on touch, where the header's swipe action already
                 carries Rename (see wireNative). -->
            <button onclick="renameCategory(${c.id})" title="Rename category" aria-label="Rename category"
                    class="needs-net cat-rename hover-action text-xs px-1.5 leading-none" style="color: var(--label3)">✎</button>
            <button onclick="deleteCategory(${c.id}, this)" title="Delete category"
                    class="needs-net cat-del hover:!text-red-500 text-sm px-1.5 leading-none" style="color: var(--label3)">✕</button>
          </div>`}
          ${collapsed ? '' : `
          <div class="un-group">
            ${openAdders.has(c.id) && !searching ? `
            <form onsubmit="return addItem(event, ${c.id})" class="un-group-row flex items-center gap-2.5 px-4 py-2">
              <span class="tinted text-[18px] leading-none select-none">+</span>
              <input name="text" placeholder="Add an item…" autocomplete="off" enterkeyhint="done"
                     onkeydown="if (event.key === 'Escape') toggleAdder(${c.id})" onblur="commitOnBlur(event)"
                     class="flex-1 bg-transparent text-[15px] focus:outline-none py-1" style="color: var(--label)">
            </form>` : ''}
            <div class="active-items${unchecked.length || activeLane ? '' : ' hidden'}">
              ${unchecked.map(renderItem).join('')}
              ${activeLane ? `
              <button type="button" onclick="emptyNoteTap(${c.id})" title="${empty ? 'Add the first item' : 'Add an item'}"
                      class="empty-note${empty ? '' : ' done-note'} un-group-row un-pressable un-touch-target w-full flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-left cursor-pointer"
                      style="color: var(--label2)">
                <span class="tinted text-[18px] leading-none select-none" aria-hidden="true">+</span>
                <span>${empty ? 'No items yet' : 'All done — add another'}</span>
              </button>` : ''}
            </div>
            ${checked.length ? `
            <!-- The ONLY control for done-item visibility now that the header
                 chevron collapses the whole category. Rendered for every
                 category with completed items, finished ones included: an
                 expanded finished category needs a way back to hiding them
                 that isn't "collapse the card". -->
            ${searching ? '' : `
            <button onclick="toggleCatDone(${c.id})" title="${showDone ? 'Hide' : 'Show'} completed in this category"
                    class="un-group-row w-full flex items-center justify-between px-4 py-2 text-[13px]" style="color: var(--label2)">
              <span>${checked.length} done</span><span>${showDone ? '▾' : '▸'}</span>
            </button>`}
            ${showDone ? `<div class="done-items">${checked.map(renderItem).join('')}</div>` : ''}` : ''}
          </div>`}
        </section>`;
    }

    // Tapping the row TEXT opens the item for renaming; only the circle ticks
    // it (issue #48 — reading a list with a thumb on the screen used to change
    // it). Interactive children — the checkbox and its 44px label, the due
    // chip, the hover actions, the drag handle — keep their own behavior.
    // The kit's swipe recognizer suppresses the click that trails a swipe.
    // A row's id is read from the DOM at tap time, never captured at render
    // time: a queued add adopts its server id in place, so a value baked into
    // the handler can be one request out of date.
    const rowId = el => +el.closest('.item-row').dataset.item;

    function rowTap(ev, el) {
      if (ev.target.closest('button, input, label, .drag-handle, .due-chip')) return;
      editItem(rowId(el));
    }

    function renderItem(i) {
      // The row itself never looks pending — the change IS applied, it just
      // hasn't reached the server. A quiet marker says so, and only after the
      // change has been unsent long enough to be worth mentioning.
      const pending = pendingShown && pendingItemIds().has(i.id);
      const dates = datesOn();
      const overdue = dates && isOverdue(i);
      return `
        <div class="un-group-row un-pressable item-row group flex items-center gap-2.5 px-4 py-2.5 cursor-pointer"
             data-item="${i.id}" data-cat="${i.category_id}" data-checked="${i.checked ? 1 : 0}"${pending ? ' data-pending="1"' : ''}
             onclick="rowTap(event, this)">
          ${searchActive() ? '' : (dates
            ? `<span class="drag-handle select-none text-sm shrink-0" style="color: var(--label3)" title="Sorted by due date" onclick="dateSortHint()">⠿</span>`
            : `<span class="drag-handle item-drag select-none text-sm shrink-0" style="color: var(--label3)" title="Drag to reorder">⠿</span>`)}
          <!-- A <label>, deliberately: the 44px hit area is an overlay
               pseudo-element on the wrapper, and only a label makes a tap
               landing in that overlay toggle the enclosed input natively. It
               can't go on the input itself — .todo-check:checked::after
               already owns that pseudo-element to draw the tick. -->
          <label class="check-hit" title="${i.checked ? 'Mark as not done' : 'Mark as done'}">
            <input type="checkbox" ${i.checked ? 'checked' : ''} onchange="toggleItem(rowId(this), this.checked)"
                   class="todo-check">
          </label>
          <span class="flex-1 text-[16px] break-words ${i.checked ? 'line-through' : ''}"${i.checked ? ' style="color: var(--label2)"' : ''}>${esc(i.text)}</span>
          ${pending ? `<span class="pending-dot shrink-0 text-[15px] leading-none" data-pending-dot
                 title="Waiting to sync" aria-label="Waiting to sync">⋯</span>` : ''}
          ${i.last_checked_by ? `<span class="shrink-0 text-[11px]" style="color: var(--label3)" title="Last ${i.checked ? 'checked' : 'unchecked'} by @${esc(i.last_checked_by)}">${i.checked ? '✓' : '↺'} @${esc(i.last_checked_by)}</span>` : ''}
          ${dates ? (i.due_date ? `
          <button onclick="openDueEditor(rowId(this))" title="Change due date"
                  class="due-chip un-touch-target shrink-0 text-[11px] leading-none px-2 py-1 rounded-full"
                  style="background: var(--fill); color: var(--${overdue ? 'danger' : 'label2'})"
                  data-due="${esc(i.due_date)}"${overdue ? ' data-overdue="1"' : ''}>${esc(dueLabel(i))}</button>` : `
          <button onclick="openDueEditor(rowId(this))" title="Add a due date" aria-label="Add a due date"
                  class="due-chip un-touch-target shrink-0 text-[11px] leading-none px-2 py-1 rounded-full"
                  style="color: var(--label3); border: 1px dashed var(--separator)">+ date</button>`) : ''}
          <button onclick="editItem(rowId(this))" title="Edit"
                  class="hover-action opacity-0 group-hover:opacity-100 text-xs px-1" style="color: var(--label2)">✎</button>
          <button onclick="deleteItem(rowId(this))" title="Delete"
                  class="hover-action opacity-0 group-hover:opacity-100 hover:!text-red-500 text-xs px-1" style="color: var(--label2)">✕</button>
        </div>`;
    }

    // Targeted repaints — swap just the affected category section so the rest
    // of the screen (and input focus elsewhere) is untouched.
    function repaintCategory(catId) {
      // Mid-search an edit can hide the category entirely or leave zero
      // matches overall (the "No items match" note), so repaint everything.
      if (searchActive()) return repaintAllCategories();
      const c = current.categories.find(x => x.id === catId);
      const el = document.getElementById('cat-' + catId);
      if (!c || !el) return;
      el.outerHTML = renderCategory(c);
      wireNative();
    }
    function repaintAllCategories() {
      const el = document.getElementById('cats');
      if (el) { el.innerHTML = renderCats(); wireNative(); }
    }

    // --- usernode-native attach pass ---------------------------------------------
    // The app re-renders by swapping innerHTML/outerHTML, so kit attachments
    // die with the old nodes. This runs after every render/repaint: swipe
    // actions on new rows/headers (flagged so surviving rows aren't re-wired;
    // per-row handles are GC'd with their nodes), then the two reorder
    // instances and the nav bar, which are detached and re-attached fresh.
    let navBarHandle = null, reorderItemsHandle = null, reorderCatsHandle = null;

    function wireNative() {
      if (!window.unNative) return;

      // Nav bar: hairline on scroll + (on Home) large-title collapse.
      if (navBarHandle) { navBarHandle.detach(); navBarHandle = null; }
      const bar = document.getElementById('home-bar') || document.getElementById('list-bar');
      if (bar) {
        const largeTitleEl = document.getElementById('home-large-title');
        navBarHandle = unNative.attachNavBar(bar, largeTitleEl ? { largeTitleEl } : {});
      }

      // Swipe actions FIRST (reorder composes with the .un-swipe wrappers).
      document.querySelectorAll('#cats .item-row:not([data-wired])').forEach(row => {
        row.dataset.wired = '1';
        // Resolved per tap, not per wire: an add that adopts its server id
        // rewrites data-item on the surviving row (see adoptServerItem).
        const id = () => +row.dataset.item;
        const checked = row.dataset.checked === '1';
        unNative.attachSwipeActions(row, {
          actions: [
            { label: checked ? 'Undo' : 'Complete', color: 'var(--un-accent)',
              handler: () => toggleItem(id(), !checked) },
            { label: 'Rename', handler: () => editItem(id()) },
            // Destructive last action: full swipe / hard flick commits, the
            // kit collapses and removes the row, then deleteItem() records the
            // change (and repaints the row back in if it couldn't).
            { label: 'Delete', destructive: true, handler: () => deleteItem(id()) },
          ],
        });
      });
      document.querySelectorAll('#cats .cat-head:not([data-wired])').forEach(head => {
        head.dataset.wired = '1';
        const sec = head.closest('.cat-section');
        if (!sec) return;
        const id = +sec.dataset.cat;
        unNative.attachSwipeActions(head, {
          actions: [
            { label: 'Rename', handler: () => renameCategory(id) },
            // Danger-colored but NOT destructive:true — a full swipe must not
            // delete a whole category; the handler keeps the confirm gate.
            { label: 'Delete', color: 'var(--un-action-danger)', handler: () => deleteCategory(id) },
          ],
        });
      });

      // Reorder: one instance spanning every item row across all category
      // cards (indices span the matched list, so cross-category moves work)
      // and one for the category sections. Disabled while a search filters
      // the view (visible order no longer matches stored order) and while
      // offline (reorder has no queued replay path — see revertOrder below).
      if (reorderItemsHandle) { reorderItemsHandle.detach(); reorderItemsHandle = null; }
      if (reorderCatsHandle) { reorderCatsHandle.detach(); reorderCatsHandle = null; }
      const cats = document.getElementById('cats');
      // Item drag is also off while the list sorts by due date: manual order
      // isn't what's on screen, so dragging a row could only lie about it.
      if (cats && !searchActive() && isOnline() && !datesOn()) {
        reorderItemsHandle = unNative.attachReorder(cats, {
          // Rows are wrapped in .un-swipe by attachSwipeActions; the
          // .empty-note placeholder makes empty categories valid drop
          // targets (moving the placeholder itself is undone below).
          itemSelector: '.un-swipe:has(.item-row), .item-row.un-swipe, .empty-note',
          handle: '.item-drag',
          onReorder: (from, to, el) => onItemReorder(el),
          // The repaint waits for the kit's drop spring to finish (issue #43):
          // swapping the markup out mid-flight is what made the released row
          // snap into place instead of landing.
          onSettle: settleItemReorder,
        });
        reorderCatsHandle = unNative.attachReorder(cats, {
          itemSelector: '.cat-section',
          handle: '.cat-drag',
          onReorder: (from, to, el) => onCategoryReorder(el),
        });
      }
    }

    // --- reorder drop animation (issue #43) ------------------------------------
    // The kit only FLIPs siblings in grid mode; in list mode the rows around the
    // dragged one jump. On top of that the repaint below used to run inside
    // onReorder — i.e. while the kit's drop spring was still animating the
    // released row — so the row it was animating got replaced and the drop read
    // as a snap. Two halves to the fix: the repaint now waits for onSettle, and
    // it runs inside a FLIP pass so every row that changed place slides there.
    //
    // Transforms only (never top/height), so nothing here can reflow the list.
    const FLIP_MS = 200;
    const FLIP_EASE = 'cubic-bezier(.22,.61,.36,1)';

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function flipRows(mutate) {
      const cats = document.getElementById('cats');
      if (!cats || prefersReducedMotion() || typeof Element.prototype.animate !== 'function') {
        mutate();
        return;
      }
      const before = new Map();
      cats.querySelectorAll('.item-row').forEach(r => {
        before.set(r.dataset.item, r.getBoundingClientRect().top);
      });
      mutate();
      const moved = [];
      document.querySelectorAll('#cats .item-row').forEach(r => {
        const prev = before.get(r.dataset.item);
        if (prev == null) return;
        const dy = prev - r.getBoundingClientRect().top;
        if (Math.abs(dy) < 1) return; // unmoved: no animation, no compositor work
        moved.push([r, dy]);
      });
      moved.forEach(([r, dy]) => {
        try {
          r.animate(
            [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(0)' }],
            { duration: FLIP_MS, easing: FLIP_EASE }
          );
        } catch (_) { /* animation is decoration; the layout is already right */ }
      });
    }

    // Set by onItemReorder, run when the kit says the drop has settled. The
    // timer is a backstop: if the kit in use predates onSettle the repaint
    // still happens, just without waiting for a spring that never reports.
    let pendingReorderRepaint = null, reorderSettleTimer = null;

    function scheduleReorderRepaint(fn) {
      pendingReorderRepaint = fn;
      clearTimeout(reorderSettleTimer);
      reorderSettleTimer = setTimeout(settleItemReorder, 500);
    }

    function settleItemReorder() {
      clearTimeout(reorderSettleTimer);
      reorderSettleTimer = null;
      const fn = pendingReorderRepaint;
      pendingReorderRepaint = null;
      if (fn) flipRows(fn);
    }

    // The kit has already moved the element in the DOM; derive the new order
    // from where it landed, update local state, persist, and repaint the
    // affected sections to normalize the markup.
    function onItemReorder(el) {
      if (!current) return;
      if (el.classList.contains('empty-note')) { scheduleReorderRepaint(repaintAllCategories); return; }
      const row = el.classList.contains('item-row') ? el : el.querySelector('.item-row');
      const sec = el.closest('.cat-section');
      if (!row || !sec) { refreshList(); return; }
      const id = +row.dataset.item;
      const item = current.items.find(i => i.id === id);
      if (!item) { refreshList(); return; }
      const checked = !!item.checked;
      const toCat = +sec.dataset.cat;
      const fromCat = item.category_id;
      // Reordering WITHIN a category still can't cross the done divider: the
      // two sections are ordered separately, so a row dropped in the wrong one
      // is meaningless and gets undone. A move INTO another category does mean
      // something — the user is choosing the category, and the row belongs in
      // whichever of its sections matches its own checked state — so the lane
      // it landed in is ignored there. Demanding a matching lane is what made a
      // category holding a single item undroppable (issue #51): one item is one
      // section, so half of every drag into it landed in the "wrong" lane and
      // sprang straight back out.
      const landedInDone = !!el.closest('.done-items');
      if (fromCat === toCat) {
        const otherRows = Array.from(sec.querySelectorAll('.item-row')).filter(r => +r.dataset.item !== id);
        if (otherRows.length && landedInDone !== checked) { scheduleReorderRepaint(repaintAllCategories); return; }
      }
      // A done row dropped into a category whose completed items are hidden
      // would vanish on the repaint below — the drag would read as a delete.
      // Open that category's done section so what was just placed stays put.
      if (fromCat !== toCat && checked && !catShowDone(toCat)) catDoneOverrides[toCat] = true;
      // New order = visible DOM order of this section's matching rows.
      const ids = Array.from(sec.querySelectorAll('.item-row'))
        .filter(r => (r.dataset.checked === '1') === checked)
        .map(r => +r.dataset.item);
      item.category_id = toCat;
      ids.forEach((iid, idx) => {
        const it = current.items.find(x => x.id === iid);
        if (it) it.sort_order = idx + 1;
      });
      const touched = fromCat === toCat ? [toCat] : [fromCat, toCat];
      scheduleReorderRepaint(() => touched.forEach(repaintCategory));
      // An item whose create hasn't reached the server has no id to reorder by
      // yet. Keep the local move and let the refetch after the drain settle it,
      // rather than sending a temp id the server can't match.
      if (isTempId(id) || ids.some(isTempId)) {
        toast('Still saving that item — its position will settle in a moment.');
        return;
      }
      persistItemOrder(id, fromCat, toCat, ids);
    }

    async function persistItemOrder(id, fromCat, toCat, ids) {
      try {
        if (fromCat !== toCat) {
          await api('/api/items/' + id, {
            method: 'PATCH', body: JSON.stringify({ category_id: toCat }), timeoutMs: MUTATION_TIMEOUT_MS,
          });
        }
        await api('/api/categories/' + toCat + '/reorder-items', {
          method: 'POST', body: JSON.stringify({ itemIds: ids }), timeoutMs: MUTATION_TIMEOUT_MS,
        });
      } catch (e) { revertOrder(e); }
    }

    // A reorder has no offline queue path, so a failed one must not linger on
    // screen: restore the saved copy (offline) or refetch (server error).
    function revertOrder(e) {
      // A timeout may well have landed, so treat it like a server error and
      // ask the server what the order actually is — never silently undo it.
      if (!e.network || e.timeout) { toast(e.message); refreshList(); return; }
      toast("You're offline — reordering needs a connection.");
      const saved = current && cacheGet(listKey(current.list.id));
      if (saved) { current = saved; renderList(current); } else { refreshList(); }
    }

    function onCategoryReorder() {
      if (!current) return;
      const ids = Array.from(document.querySelectorAll('#cats .cat-section')).map(s => +s.dataset.cat);
      current.categories.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      current.categories.forEach((c, idx) => { c.sort_order = idx; });
      repaintAllCategories();
      api('/api/lists/' + current.list.id + '/reorder-categories', {
        method: 'POST', body: JSON.stringify({ categoryIds: ids }), timeoutMs: MUTATION_TIMEOUT_MS,
      }).catch(revertOrder);
    }

    // --- search handlers -------------------------------------------------------
    // The input lives outside #cats, so these repaints never touch it and
    // focus survives typing naturally.
    function onSearchInput(v) {
      searchQuery = v;
      syncSearchChrome();
      repaintAllCategories();
    }
    function clearSearch() {
      if (!searchQuery) return;
      searchQuery = '';
      const input = document.getElementById('search-input');
      if (input) { input.value = ''; input.focus({ preventScroll: true }); }
      syncSearchChrome();
      repaintAllCategories();
    }
    // Bits outside #cats that depend on the query: the ✕ clear button and the
    // "New category…" form (hidden while filtering).
    function syncSearchChrome() {
      const btn = document.getElementById('search-clear');
      if (btn) btn.classList.toggle('hidden', !searchQuery);
      const form = document.getElementById('new-cat-form');
      if (form) form.classList.toggle('hidden', searchActive());
      const qa = document.getElementById('quick-add-form');
      if (qa) qa.classList.toggle('hidden', searchActive());
    }

    // --- connection-only actions --------------------------------------------------
    // Lists, categories, reorders, import and membership have no offline path,
    // so they DO have to wait for the server. What they must never do is wait
    // silently: the control that was tapped shows it is working, refuses a
    // second tap, and the request has a deadline.

    async function withBusy(el, fn) {
      if (!el || !el.tagName) return fn();
      if (el.dataset.busy) return; // already in flight — ignore the repeat tap
      el.dataset.busy = '1';
      const controls = el.tagName === 'FORM'
        ? Array.from(el.querySelectorAll('input, button, textarea'))
        : [el];
      const labelled = el.tagName === 'FORM' ? null : el;
      const label = labelled ? labelled.innerHTML : null;
      controls.forEach(c => { c.disabled = true; });
      el.setAttribute('aria-busy', 'true');
      el.style.opacity = '.55';
      // Only a request that is actually slow gets the "…" — a fast one just
      // completes, with no flicker.
      const hint = labelled ? setTimeout(() => { labelled.innerHTML = '…'; }, BUSY_HINT_MS) : null;
      try {
        return await fn();
      } finally {
        clearTimeout(hint);
        delete el.dataset.busy;
        // A repaint may have replaced the element while we waited.
        if (el.isConnected) {
          if (label !== null) labelled.innerHTML = label;
          controls.forEach(c => { if (c.isConnected) c.disabled = false; });
          el.removeAttribute('aria-busy');
          el.style.opacity = '';
        }
      }
    }

    // A write with no queue behind it that timed out MAY have landed, so never
    // claim it failed. Say what is actually known and reconcile from the
    // server, which is the only thing that can settle it.
    function reportWriteError(e) {
      if (e.timeout) {
        toast("We didn't hear back — your change may not have saved.");
        if (current) refreshList(); else refreshHome();
        return true;
      }
      toast(e.message);
      return false;
    }

    // --- list actions ------------------------------------------------------------
    async function renameList(btn) {
      if (!requireOnline()) return;
      const name = await askText('Rename list:', current.list.name);
      if (!name || !name.trim() || name.trim() === current.list.name) return;
      await withBusy(btn, async () => {
        try {
          await api('/api/lists/' + current.list.id, {
            method: 'PATCH', body: JSON.stringify({ name: name.trim() }), timeoutMs: MUTATION_TIMEOUT_MS,
          });
          current.list.name = name.trim();
          renderList(current);
        } catch (e) { reportWriteError(e); }
      });
    }

    async function deleteList(btn) {
      if (!requireOnline()) return;
      if (!await askConfirm('Delete "' + current.list.name + '" and all its items? This can\'t be undone.')) return;
      await withBusy(btn, async () => {
        try {
          await api('/api/lists/' + current.list.id, { method: 'DELETE', timeoutMs: MUTATION_TIMEOUT_MS });
          location.hash = '#/';
        } catch (e) {
          // A timed-out delete may have gone through, so go back to My Lists
          // and let it show whether the list is still there.
          if (e.timeout) { toast("We didn't hear back — checking…"); location.hash = '#/'; return; }
          toast(e.message);
        }
      });
    }

    // --- category actions ----------------------------------------------------------
    async function addCategory(ev) {
      ev.preventDefault();
      const form = ev.target;
      const input = form.elements.name;
      const name = input.value.trim();
      if (!name) return false;
      if (!requireOnline()) return false;
      input.value = ''; // before the await: a trailing keyboard-done blur finds it empty
      withBusy(form, async () => {
        try {
          const { category } = await api('/api/lists/' + current.list.id + '/categories', {
            method: 'POST', body: JSON.stringify({ name }), timeoutMs: MUTATION_TIMEOUT_MS,
          });
          current.categories.push(category);
          // The form itself isn't re-rendered, so input focus (when it still
          // has it) survives on its own.
          repaintAllCategories();
        } catch (e) {
          // Only offer the text back when we know it didn't land — restoring it
          // after a timeout invites a duplicate category.
          if (!reportWriteError(e)) input.value = name;
        }
      });
      return false;
    }

    async function renameCategory(id) {
      if (!requireOnline()) return;
      const cat = current.categories.find(c => c.id === id);
      const name = await askText('Rename category:', cat ? cat.name : '');
      if (!name || !name.trim()) return;
      try {
        await api('/api/categories/' + id, {
          method: 'PATCH', body: JSON.stringify({ name: name.trim() }), timeoutMs: MUTATION_TIMEOUT_MS,
        });
        cat.name = name.trim();
        repaintCategory(id);
      } catch (e) { reportWriteError(e); }
    }

    // Any category can be deleted (with its items) except the last one.
    async function deleteCategory(id, btn) {
      if (!requireOnline()) return;
      if (current.categories.length <= 1) {
        return toast("Can't delete the only category — lists need at least one");
      }
      const cat = current.categories.find(c => c.id === id);
      const n = current.items.filter(i => i.category_id === id).length;
      const msg = 'Delete category "' + (cat ? cat.name : '') + '"' +
        (n ? ' and its ' + n + ' item' + (n > 1 ? 's' : '') : '') + '?';
      if (!await askConfirm(msg)) return;
      await withBusy(btn, async () => {
        try {
          await api('/api/categories/' + id, { method: 'DELETE', timeoutMs: MUTATION_TIMEOUT_MS });
          current.categories = current.categories.filter(c => c.id !== id);
          current.items = current.items.filter(i => i.category_id !== id);
          const el = document.getElementById('cat-' + id);
          if (el) el.remove();
          wireNative(); // re-index the reorder instances after the removal
        } catch (e) { reportWriteError(e); }
      });
    }

    // --- undo / redo (issue #45) -----------------------------------------------
    // Covers the everyday item mutations — add, delete, rename, tick/untick and
    // (with due dates on) the due date itself. Session- and list-scoped: opening
    // another list or Home clears the stacks, because an undo reaching back into
    // a screen the user has left is a surprise, not a convenience.
    //
    // Entries are plain data rather than closures, because ids move: an add's
    // temp id becomes the server's id when its create lands, and every entry
    // holding that id has to follow (remapHistoryId, called from
    // adoptServerItem). Each step replays through the ordinary mutator, so undo
    // is queued, offline-safe and coalesced exactly like the action it reverses.
    const HISTORY_MAX = 50;
    let undoStack = [], redoStack = [], historyBusy = false;

    function clearHistory() {
      undoStack = [];
      redoStack = [];
      syncUndoChrome();
    }

    function record(entry) {
      if (historyBusy) return; // undo/redo move the entry themselves
      undoStack.push(entry);
      if (undoStack.length > HISTORY_MAX) undoStack.shift();
      redoStack = []; // a fresh action forks the timeline
      syncUndoChrome();
    }

    function remapHistoryId(oldId, newId) {
      if (oldId === newId) return;
      undoStack.concat(redoStack).forEach(e => { if (e.itemId === oldId) e.itemId = newId; });
    }

    // Runs one entry in one direction. Synchronous on purpose: every mutator it
    // calls applies locally and queues, so nothing here can interleave with a
    // network reply that renumbers the row mid-step.
    function runHistory(entry, dir) {
      const found = () => current && current.items.find(i => i.id === entry.itemId);
      historyBusy = true;
      try {
        if (entry.kind === 'add' || entry.kind === 'delete') {
          // Undoing an add is a delete; undoing a delete is a create. (The
          // server row is gone for good, so the restored item is a new row that
          // inherits the old one's text, category, tick and due date.)
          const removing = (entry.kind === 'add') === (dir === 'undo');
          if (removing) {
            if (!found()) return false;
            deleteItem(entry.itemId);
            return true;
          }
          const newId = restoreItem(entry.snapshot);
          if (newId == null) return false;
          remapHistoryId(entry.itemId, newId);
          entry.itemId = newId;
          return true;
        }
        if (!found()) return false;
        const v = dir === 'undo' ? entry.before : entry.after;
        if (entry.kind === 'edit') return applyEditText(entry.itemId, v.text);
        if (entry.kind === 'toggle') { toggleItem(entry.itemId, v.checked); return true; }
        if (entry.kind === 'due') return applyDue(entry.itemId, v.due_date, v.due_time);
        return false;
      } finally {
        historyBusy = false;
      }
    }

    function doUndo() {
      if (!current || !undoStack.length) return;
      const entry = undoStack.pop();
      if (!runHistory(entry, 'undo')) {
        // The row it points at is gone (deleted by another member, or dropped
        // by a rejected op). Discard the entry rather than pretending.
        syncUndoChrome();
        toast("Can't undo that — the item is gone");
        return;
      }
      redoStack.push(entry);
      if (redoStack.length > HISTORY_MAX) redoStack.shift();
      syncUndoChrome();
      toast('Undone');
    }

    function doRedo() {
      if (!current || !redoStack.length) return;
      const entry = redoStack.pop();
      if (!runHistory(entry, 'redo')) {
        syncUndoChrome();
        toast("Can't redo that — the item is gone");
        return;
      }
      undoStack.push(entry);
      if (undoStack.length > HISTORY_MAX) undoStack.shift();
      syncUndoChrome();
      toast('Redone');
    }

    // Header buttons live outside #cats, so they need their own sync pass after
    // anything that changes the stacks (same shape as syncSearchChrome).
    function syncUndoChrome() {
      setHistoryBtn(document.getElementById('undo-btn'), undoStack.length > 0);
      setHistoryBtn(document.getElementById('redo-btn'), redoStack.length > 0);
    }
    function setHistoryBtn(btn, enabled) {
      if (!btn) return;
      btn.disabled = !enabled;
      btn.style.opacity = enabled ? '1' : '.3';
      btn.setAttribute('aria-disabled', enabled ? 'false' : 'true');
    }

    // ⌘Z / Ctrl+Z, and ⇧⌘Z / Ctrl+Shift+Z / Ctrl+Y to redo. Never while a text
    // field has focus: there, the platform's own text undo is the right one.
    document.addEventListener('keydown', ev => {
      if (!(ev.metaKey || ev.ctrlKey) || ev.altKey) return;
      const k = (ev.key || '').toLowerCase();
      if (k !== 'z' && k !== 'y') return;
      const t = ev.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (!current) return;
      ev.preventDefault();
      if (k === 'y' || ev.shiftKey) doRedo();
      else doUndo();
    });

    // --- item actions ---------------------------------------------------------------
    // The four daily-use actions never await the network. Each one records the
    // change in the queue (a synchronous localStorage write), applies it to the
    // local state and repaints — so the row moves the instant it is tapped,
    // whether the connection is fast, crawling or gone. The sender drains in
    // the background and reconciles when it lands.

    // Quick-add: the always-visible field above the list; items land in the
    // default (uncategorized) bucket. The form lives outside #cats, so the
    // full repaint below never disturbs its focus.
    function quickAdd(ev) {
      ev.preventDefault();
      const input = ev.target.elements.text;
      const text = input.value.trim();
      if (!text) return false;
      input.value = '';
      // A local bucket must exist to hold the row; the list-level POST is what
      // decides where it really goes (and creates the bucket server-side).
      const bucket = current.categories.find(c => c.is_default) || current.categories[0];
      if (!bucket) { input.value = text; toast('This list has no category to add to'); return false; }
      const tempId = tempSeq--;
      if (!commit({ type: 'add', itemId: tempId, method: 'POST',
                    path: '/api/lists/' + current.list.id + '/items', body: { text } })) {
        input.value = text;
        return false;
      }
      const item = localNewItem(tempId, bucket.id, text);
      current.items.push(item);
      record({ kind: 'add', itemId: tempId, snapshot: { ...item } });
      cacheList();
      repaintAllCategories();
      return false;
    }

    function addItem(ev, categoryId) {
      ev.preventDefault();
      const input = ev.target.elements.text;
      const text = input.value.trim();
      if (!text) return false;
      input.value = '';
      const wasFullyDone = isCatFullyDone(categoryId);
      const tempId = tempSeq--;
      if (!commit({ type: 'add', itemId: tempId, method: 'POST',
                    path: '/api/categories/' + categoryId + '/items', body: { text } })) {
        input.value = text;
        return false;
      }
      const item = localNewItem(tempId, categoryId, text);
      current.items.push(item); // smallest sort_order → top of the active list
      record({ kind: 'add', itemId: tempId, snapshot: { ...item } });
      cacheList();
      if (wasFullyDone) {
        // The section was rendered compact (inline done toggle, tight
        // spacing) and is now active again — a surgical insert would leave
        // that stale, so repaint the whole section and restore focus.
        repaintCategory(categoryId);
        const fresh = document.querySelector('#cat-' + categoryId + ' input[name=text]');
        if (fresh) fresh.focus({ preventScroll: true });
      } else {
        // Insert just the new row; the form (and its focus) is untouched,
        // so the view stays perfectly still. wireNative picks up the new
        // row (it has no data-wired flag yet) without touching the form.
        const body = document.querySelector('#cat-' + categoryId + ' .active-items');
        if (body) {
          const ph = body.querySelector('.empty-note');
          if (ph) ph.remove();
          body.insertAdjacentHTML('afterbegin', renderItem(item));
          wireNative();
        }
      }
      return false;
    }

    function toggleItem(id, checked) {
      const item = current.items.find(i => i.id === id);
      if (!item) return;
      // Capture done-visibility first: checking the last open item flips the
      // category to fully done, which defaults to collapsed.
      const wasShowingDone = catShowDone(item.category_id);
      const undo = { checked: item.checked, completed_at: item.completed_at,
                     last_checked_by: item.last_checked_by, sort_order: item.sort_order };
      if (!commit({ type: 'toggle', itemId: id, method: 'PATCH',
                    path: '/api/items/' + id, body: { checked }, undo })) return;
      // Mirror the server's move-to-section-bottom so the row lands exactly
      // where the eventual refetch will put it.
      item.checked = checked;
      item.completed_at = checked ? new Date().toISOString() : null;
      item.last_checked_by = checked ? (me || item.last_checked_by) : item.last_checked_by;
      item.sort_order = sectionBottom(current.items, item.category_id, checked, id);
      record({ kind: 'toggle', itemId: id, before: { checked: undo.checked }, after: { checked } });
      cacheList();
      // Keep a newly fully-done category expanded only if its done items
      // were already visible, so the rows the user is looking at don't
      // vanish mid-interaction. A category the user had collapsed stays
      // collapsed — checking its last item must not pop it open.
      if (checked && wasShowingDone && isCatFullyDone(item.category_id)) catDoneOverrides[item.category_id] = true;
      repaintCategory(item.category_id);
    }

    async function editItem(id) {
      const existing = current.items.find(i => i.id === id);
      const text = await askText('Edit item:', existing ? existing.text : '');
      if (!text || !text.trim()) return;
      applyEditText(id, text.trim());
    }

    // The prompt-free half of editItem, so undo/redo can set a known text
    // without asking the user to retype it.
    function applyEditText(id, text) {
      const idx = current.items.findIndex(i => i.id === id);
      if (idx === -1) return false; // deleted while the prompt was open
      const before = current.items[idx].text;
      if (before === text) return true;
      if (!commit({ type: 'edit', itemId: id, method: 'PATCH',
                    path: '/api/items/' + id, body: { text },
                    undo: { text: before } })) return false;
      current.items[idx] = { ...current.items[idx], text };
      record({ kind: 'edit', itemId: id, before: { text: before }, after: { text } });
      cacheList();
      repaintCategory(current.items[idx].category_id);
      return true;
    }

    function deleteItem(id) {
      const item = current.items.find(i => i.id === id);
      if (!item) return;
      // An item whose create is still queued has never existed server-side, so
      // coalesce() cancels both ops and nothing is sent.
      if (!commit({ type: 'delete', itemId: id, method: 'DELETE',
                    path: '/api/items/' + id, undo: item })) {
        // Couldn't even record the intent — put the row back. A full-swipe
        // delete has already collapsed it out of the DOM (the kit removes it
        // before calling this handler).
        repaintCategory(item.category_id);
        return;
      }
      current.items = current.items.filter(i => i.id !== id);
      record({ kind: 'delete', itemId: id, snapshot: { ...item } });
      cacheList();
      repaintCategory(item.category_id);
    }

    // Undo of a delete. The server row is gone, so this is a fresh create that
    // inherits the old row's text, category, tick and due date — each as its own
    // queued op, so the create ahead of them hands over its real id on the way
    // through (see runOp).
    function restoreItem(snap) {
      if (!current || !snap) return null;
      const cat = current.categories.find(c => c.id === snap.category_id)
        || current.categories.find(c => c.is_default) || current.categories[0];
      if (!cat) { toast('That item\'s category is gone'); return null; }
      const tempId = tempSeq--;
      if (!commit({ type: 'add', itemId: tempId, method: 'POST',
                    path: '/api/categories/' + cat.id + '/items',
                    body: { text: snap.text } })) return null;
      const item = localNewItem(tempId, cat.id, snap.text);
      current.items.push(item);
      cacheList();
      repaintCategory(cat.id);
      if (snap.checked) toggleItem(tempId, true);
      if (snap.due_date) applyDue(tempId, snap.due_date, snap.due_time || null);
      return tempId;
    }

    // --- markdown import / export ------------------------------------------------
    // Google Keep-ish format: title as `# **Name**`, categories as top-level
    // bullets, items as nested bullets. Active items come first; a `---`
    // divider precedes the completed block, where items are ~~struck~~ and
    // category names repeat (struck too when the category is fully done).

    function buildMarkdown() {
      const active = [], done = [];
      for (const c of current.categories) {
        const un = sectionItems(c.id, false);
        const ch = sectionItems(c.id, true);
        if (un.length || !ch.length) {
          active.push('* ' + c.name);
          un.forEach(i => active.push('  * ' + i.text));
        }
        if (ch.length) {
          done.push('* ' + (un.length ? c.name : '~~' + c.name + '~~'));
          ch.forEach(i => done.push('  * ~~' + i.text + '~~'));
        }
      }
      const lines = ['# **' + current.list.name + '**', '', ...active];
      if (done.length) lines.push('', '---', '', ...done);
      return lines.join('\n') + '\n';
    }
